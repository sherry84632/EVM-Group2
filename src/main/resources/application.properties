# EVM Group 2 - Dealer Management System
# Application Configuration
spring.application.name=evm-group2
spring.thymeleaf.cache=false

# C?u h?nh datasource SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CarDealerDBI;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
# Options for ddl-auto:
# - create: DROP tables and CREATE new ones (DELETES ALL DATA on each restart!) ?
# - update: UPDATE existing tables (keeps data, adds new columns) ? RECOMMENDED for development
# - validate: Only VALIDATE schema (no changes) ? RECOMMENDED for production
# - none: Do nothing (manual schema management)
# Changed to 'none' because we manage schema manually via SQL migration scripts
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Spring Security Configuration
# Test users are configured in SecurityConfig.java
# For production, implement database-based authentication

# Session Management
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Actuator endpoints (for health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging Configuration
# Development logging
logging.level.org.springframework.security=DEBUG
logging.level.com.dealermanagementsysstem.project=DEBUG
#logging.level.org.thymeleaf=TRACE

# Production logging (uncomment for production)
# logging.level.org.springframework.security=WARN
# logging.level.com.dealermanagementsysstem.project=INFO
# logging.level.org.thymeleaf=WARN