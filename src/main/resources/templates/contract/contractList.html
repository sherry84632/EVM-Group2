<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contracts</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4 bg-light">
<h2 class="mb-3">Sale Contracts</h2>
<table class="table table-sm table-hover bg-white">
    <thead class="table-light">
    <tr><th>ID</th><th>SaleOrder</th><th>Date</th><th>Status</th><th>Total</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="c : ${contracts}" th:with="so=${c.saleOrder}">
        <td th:text="${c.contractID}"></td>
        <td th:text="${c.saleOrder?.saleOrderID}"></td>
        <td th:text="${#dates.format(c.contractDate,'dd/MM/yyyy')}"></td>
        <td th:text="${c.status}"></td>
        <td th:text="'$' + ${#numbers.formatDecimal(c.totalAmount,0,'COMMA',0,'POINT')}"></td>
        <td><a th:href="@{/contract/detail/{id}(id=${c.contractID})}" class="btn btn-sm btn-outline-primary">View</a></td>
    </tr>
    </tbody>
</table>
<a href="/saleorder" class="btn btn-link btn-sm">Back to Sale Orders</a>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
