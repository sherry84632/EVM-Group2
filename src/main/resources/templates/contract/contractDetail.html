<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contract Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="p-4 bg-light" th:with="so=${contract.saleOrder}">
    <h2>Contract #<span th:text="${contract.contractID}">-</span></h2>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="card p-3 mb-3">
        <h5 class="mb-3">Basic Info</h5>
        <div class="row g-3 small">
            <div class="col-md-3"><strong>Sale Order ID:</strong> <span th:text="${so.saleOrderID}">-</span></div>
            <div class="col-md-3"><strong>Date:</strong> <span th:text="${#dates.format(contract.contractDate,'dd/MM/yyyy')}">-</span></div>
            <div class="col-md-3"><strong>Status:</strong> <span th:text="${contract.status}">-</span></div>
            <div class="col-md-3"><strong>Total Amount:</strong> <span th:text="'$' + ${#numbers.formatDecimal(contract.totalAmount,0,'COMMA',0,'POINT')}">$0</span></div>
        </div>
    </div>
    <div class="card p-3 mb-3">
        <h5 class="mb-3">Vehicles</h5>
        <div th:if="${so.detail != null and !so.detail.isEmpty()}">
            <table class="table table-sm table-hover">
                <thead class="table-light"><tr><th>#</th><th>VehicleID</th><th>Model</th><th>Version</th><th>Color</th><th>Unit Price</th></tr></thead>
                <tbody>
                <tr th:each="d,stat : ${so.detail}">
                    <td th:text="${stat.index+1}"></td>
                    <td th:text="${d.vehicle != null ? d.vehicle.vehicleID : '-'}"></td>
                    <td th:text="${d.vehicle?.version?.model?.modelName ?: '-'}"></td>
                    <td th:text="${d.vehicle?.version?.versionName ?: '-'}"></td>
                    <td th:text="${d.vehicle?.color?.colorName ?: '-'}"></td>
                    <td th:text="'$' + ${#numbers.formatDecimal(d.price,0,'COMMA',0,'POINT')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="text-muted small" th:if="${so.detail == null or so.detail.isEmpty()}">No vehicles.</p>
    </div>
    <div class="card p-3 mb-3">
        <h5 class="mb-3">Parties</h5>
        <div class="row small g-2">
            <div class="col-md-3"><strong>Customer:</strong> <span th:text="${so.customer?.fullName}">-</span></div>
            <div class="col-md-3"><strong>Cust Phone:</strong> <span th:text="${so.customer?.phone}">-</span></div>
            <div class="col-md-3"><strong>Dealer:</strong> <span th:text="${so.dealer?.dealerName}">-</span></div>
            <div class="col-md-3"><strong>Dealer Phone:</strong> <span th:text="${so.dealer?.phone}">-</span></div>
        </div>
    </div>
    <div class="card p-3 mb-3">
        <h5 class="mb-3">Actions</h5>
        <form th:action="@{/contract/updateStatus}" method="post" th:if="${contract.status.name()=='ACTIVE'}">
            <input type="hidden" name="contractID" th:value="${contract.contractID}" />
            <input type="hidden" name="status" value="COMPLETED" />
            <button class="btn btn-success btn-sm" type="submit">Mark Completed</button>
        </form>
        <form th:action="@{/contract/updateStatus}" method="post" th:if="${contract.status.name()=='ACTIVE'}" onsubmit="return confirm('Cancel contract?')">
            <input type="hidden" name="contractID" th:value="${contract.contractID}" />
            <input type="hidden" name="status" value="CANCELLED" />
            <button class="btn btn-outline-danger btn-sm" type="submit">Cancel</button>
        </form>
    </div>
    <a th:href="@{/saleorder/detail/{id}(id=${so.saleOrderID})}" class="btn btn-link btn-sm">Back to Sale Order</a>
</body>
</html>
