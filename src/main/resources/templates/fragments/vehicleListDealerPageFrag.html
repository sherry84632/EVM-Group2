<div class="d-flex" th:fragment="fragVehicleListDealer">

    <div class="scroll-box">
        <div class="items-container dv-grid">

            <!-- Item  -->
            <div class="dv-card" th:each="vehicle : ${vehicleList}">
                <div class="dv-checkbox-wrapper">
                    <input type="checkbox" class="form-check-input vehicle-select-checkbox" th:value="${vehicle.vehicleID}" />
                </div>
                <div class="dv-model-name">
                    <i class="fas fa-car-side text-primary"></i>
                    <span th:text="${vehicle.modelName}"></span>
                    <span class="dv-badge" th:text="${vehicle.version != null ? vehicle.version.versionName : 'Version'}"></span>
                </div>
                <div class="dv-meta">
                    <div class="dv-meta-row">
                        <span class="dv-label">Year</span>
                        <span class="dv-value"><span class="dv-year-tag" th:text="${vehicle.manufactureYear}"></span></span>
                    </div>
                    <div class="dv-meta-row">
                        <span class="dv-label">Base Price</span>
                        <span class="dv-value"><span class="dv-price-tag" th:text="${vehicle.basePrice}"></span></span>
                    </div>
                    <div class="dv-meta-row" th:if="${vehicle.color != null}">
                        <span class="dv-label">Color</span>
                        <span class="dv-value" th:text="${vehicle.color.colorName}"></span>
                    </div>
                </div>
                <div class="dv-actions">
                    <form th:action="@{/quotation/addVehicle}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="vehicleId" th:value="${vehicle.vehicleID}" />
                        <input type="hidden" name="customerID" value="" class="single-add-customer" />
                        <button type="submit" class="dv-btn-outline dv-btn-outline-primary" onclick="return attachSingleCustomer(this)">
                            <i class="fas fa-plus"></i> Single
                        </button>
                    </form>
                    <a th:href="@{'/quotation/new'(vehicleId=${vehicle.vehicleID})}" class="dv-btn-outline" style="text-decoration:none;">
                        <i class="fas fa-file"></i> New Quotation
                    </a>
                </div>
            </div>

        </div>
    </div>

</div>
<script>
function attachSingleCustomer(btn){
  const select = document.querySelector('select[name="customerID"]');
  if(!select || !select.value){ alert('Select a customer above first.'); return false; }
  const hidden = btn.closest('form').querySelector('.single-add-customer');
  hidden.value = select.value;
  return true;
}
</script>
