<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="/css/inentoryScrollBox.css">
    <link rel="stylesheet" href="/css/breadScrumbNav.css">
    <style>
        .card {
            margin-bottom: 12px;
        }
    </style>
</head>

<body class="bg-gradient2-custom" style="overflow: hidden;">

<button class="mobile-menu-toggle" id="menuToggleBtn">
    <i class="fa-solid fa-bars"></i>
</button>

<div class="d-flex">

    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContent flex-grow-1 p-3" style="overflow: hidden">

        <div class="container-fluid" style="margin-bottom: 12px">

            <div class="row">

                <div class="col-md-10">
                    <form action="/searchVehicleListController" method="get">
                        <div class="input-group">
                            <input name="keyword"
                                   type="text"
                                   class="form-control"
                                   placeholder="Search by model name"
                                   th:value="${keyword}"
                            >
                            <button type="submit" class="btn btn-primary">Search</button>
                        </div>
                    </form>
                </div>

                <div class="col-md-2">
                    <div th:if="${actionRole == 'EVM'}">
                        <a href="/evmCreateANewVehicleToList" style="text-decoration: none">
                            <button class="btn btn-warning">
                                <span>
                                    Create new vehicle
                                </span>
                            </button>
                        </a>
                    </div>
                </div>

            </div>

        </div>

        <div class="d-flex">

            <div class="container-fluid" style="overflow-y: auto; overflow-x: hidden; height: 83vh;">

                <div class="row">

                    <!-- Item -->
                    <div th:each="vehicle : ${vehicles}" class="col-md-6">
                        <a th:href="@{/evm/vehicle/detail/{id}(id=${vehicle.vehicleID})}" style="text-decoration: none;">
                            <div class="card shadow">
                                <div class="card-header">
                                    <div class="model-name">
                                        <span th:text="${vehicle.model != null ? vehicle.model.modelName : 'N/A'}">Model Name</span>
                                    </div>
                                </div>

                                <div class="card-body">

                                    <div class="row">

                                        <div class="col-md-3">
                                            <div class="image-placeholder">
                                                <!-- Hiển thị ảnh từ database nếu có -->
                                                <img th:if="${vehicle.version != null and vehicle.version.model != null and vehicle.version.model.modelID != null}"
                                                     th:src="@{/evm/vehicle/modelImage/{modelId}(modelId=${vehicle.version.model.modelID})}"
                                                     alt="Model Image"
                                                     class="vehicle-image"
                                                     style="object-fit: cover; width: 100%; height: 100%;"
                                                     onload="this.nextElementSibling.style.display='none';"
                                                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"/>
                                                <!-- Icon placeholder chỉ hiển thị khi không có ảnh -->
                                                <span style="font-size: 48px;">🚗</span>
                                            </div>
                                        </div>

                                        <div class="col-md-6">
                                            <div class="item-info">
                                                <div class="info-row">
                                                    <div class="info-item">
                                                        <span class="info-label">Brand:</span>
                                                        <span class="info-value" th:text="${vehicle.model != null ? vehicle.model.brand : 'N/A'}">Brand</span>
                                                    </div>
                                                    <div class="info-item">
                                                        <span class="info-label">Year:</span>
                                                        <span class="info-value" th:text="${vehicle.model != null ? vehicle.model.year : 'N/A'}">Year</span>
                                                    </div>
                                                </div>
                                                <div class="info-row">
                                                    <div class="info-item">
                                                        <span class="info-label">Version:</span>
                                                        <span class="info-value" th:text="${vehicle.version != null ? vehicle.version.versionName : 'N/A'}">Version</span>
                                                    </div>
                                                    <div class="info-item">
                                                        <span class="info-label">Status:</span>
                                                        <span class="info-value" th:text="${vehicle.status != null ? vehicle.status : 'N/A'}">Status</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                    </div>

                                </div>

                            </div>
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>

</body>

</html>
