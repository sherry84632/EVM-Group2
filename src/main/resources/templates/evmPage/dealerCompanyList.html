<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer Company Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
    <script>
        function editDealer(button) {
            document.getElementById("dealerId").value = button.getAttribute("data-id");
            document.getElementById("dealerName").value = button.getAttribute("data-name");
            document.getElementById("address").value = button.getAttribute("data-address");
            document.getElementById("phone").value = button.getAttribute("data-phone");
            document.getElementById("email").value = button.getAttribute("data-email");
            document.getElementById("levelID").value = button.getAttribute("data-level");

            document.getElementById("formTitle").innerText = "Update Dealer Company";
            document.getElementById("submitButton").innerHTML = '<i class="fas fa-save"></i> Update';
            document.getElementById("dealerForm").action = "/dealer/company/" + button.getAttribute("data-id") + "/update";
        }

        function resetForm() {
            document.getElementById("dealerForm").reset();
            document.getElementById("dealerId").value = "";
            document.getElementById("formTitle").innerText = "Add New Dealer Company";
            document.getElementById("submitButton").innerHTML = '<i class="fas fa-plus"></i> Add Dealer';
            document.getElementById("dealerForm").action = "/dealer/company/create";
        }

        document.addEventListener("DOMContentLoaded", function() {
            const alertBox = document.querySelector(".alert");
            if (alertBox) {
                setTimeout(() => {
                    alertBox.classList.remove("show");
                    alertBox.classList.add("fade");
                }, 4000);
            }
        });
    </script>
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContent flex-grow-1 p-3" style="overflow-y: auto; height: 97vh;">

        <div class="mainContentVer">
            <h2 class="mb-3"><i class="fas fa-building"></i> Dealer Company Management</h2>


            <!-- Alert Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Form Add/Update Dealer -->
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <h5 id="formTitle" class="card-title mb-3">Add New Dealer Company</h5>

                    <form id="dealerForm" action="/dealer/company/create" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" id="dealerId">

                        <div class="row g-2">
                            <div class="col-md-3">
                                <input id="dealerName" name="dealerName" class="form-control"
                                       placeholder="Dealer Company Name *" required>
                            </div>
                            <div class="col-md-3">
                                <input id="address" name="address" class="form-control"
                                       placeholder="Address">
                            </div>
                            <div class="col-md-2">
                                <input id="phone" name="phone" class="form-control"
                                       placeholder="Phone *" required>
                            </div>
                            <div class="col-md-2">
                                <input id="email" name="email" class="form-control"
                                       placeholder="Email *" type="email" required>
                            </div>
                            <div class="col-md-2">
                                <select id="levelID" name="levelID" class="form-select" required>
                                    <option value="">Select Level *</option>
                                    <option th:each="level : ${dealerLevels}"
                                            th:value="${level.levelID}"
                                            th:text="${level.levelName}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-auto d-flex gap-2">
                                <button id="submitButton" class="btn btn-success" type="submit">
                                    <i class="fas fa-plus"></i> Add Dealer
                                </button>
                                <button type="button" class="btn btn-secondary" onclick="resetForm()">
                                    <i class="fas fa-redo"></i> Reset
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Dealer Companies Table -->
            <table class="table table-bordered table-hover bg-white align-middle">
                <thead class="table-primary text-center">
                <tr>
                    <th>ID</th>
                    <th>Company Name</th>
                    <th>Address</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Level</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${dealers == null || dealers.isEmpty()}">
                    <td colspan="7" class="text-center text-muted">
                        <i class="fas fa-inbox"></i> No dealer companies yet
                    </td>
                </tr>
                <tr th:each="dealer : ${dealers}">
                    <td th:text="${dealer.dealerID}" class="text-center"></td>
                    <td>
                        <i class="fas fa-building"></i>
                        <strong th:text="${dealer.dealerName}"></strong>
                    </td>
                    <td th:text="${dealer.address}"></td>
                    <td th:text="${dealer.phone}"></td>
                    <td th:text="${dealer.email}"></td>
                    <td class="text-center">
                        <span class="badge bg-info" th:text="'Level ' + ${dealer.levelID}"></span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{'/dealer/company/' + ${dealer.dealerID} + '/detail'}"
                           class="btn btn-info btn-sm">
                            <i class="fas fa-eye"></i> View Detail
                        </a>

                        <button class="btn btn-warning btn-sm"
                                th:attr="data-id=${dealer.dealerID},
                                         data-name=${dealer.dealerName},
                                         data-address=${dealer.address},
                                         data-phone=${dealer.phone},
                                         data-email=${dealer.email},
                                         data-level=${dealer.levelID}"
                                onclick="editDealer(this)">
                            <i class="fas fa-edit"></i> Edit
                        </button>

                        <form th:action="@{'/dealer/company/' + ${dealer.dealerID} + '/delete'}"
                              method="post"
                              style="display:inline"
                              onsubmit="return confirm('⚠️ Delete dealer company: ' + this.getAttribute('data-name') + '?\n\nNote: This will fail if dealer has staff or customers.');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" th:value="${dealer.dealerName}" th:attr="data-name=${dealer.dealerName}"/>
                            <button class="btn btn-danger btn-sm" type="submit">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="text-muted mt-3">
                <i class="fas fa-info-circle"></i>
                Total: <strong th:text="${dealers != null ? dealers.size() : 0}">0</strong> dealer companies
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
