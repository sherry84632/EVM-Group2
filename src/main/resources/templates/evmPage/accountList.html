<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
</head>
<body class="bg-gradient2-custom">

<button class="mobile-menu-toggle" id="menuToggleBtn">
    <i class="fa-solid fa-bars"></i>
</button>

<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContent flex-grow-1 p-4" style="height: 97vh; overflow-y: auto; overflow-x: hidden;">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="fa-solid fa-user-shield"></i> Account Management</h1>
            <a href="/account/create" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> Create New Account
            </a>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Search Form -->
        <form th:action="@{/account/search}" method="get" class="mb-4">
            <div class="input-group">
                <input type="text" class="form-control" style="margin-left: 0px" name="keyword"
                       th:value="${keyword}"
                       placeholder="Search by username or email...">
                <button class="btn btn-outline-secondary" type="submit">
                    <i class="fa-solid fa-search"></i> Search
                </button>
                <a href="/account/list" class="btn btn-outline-secondary">
                    <i class="fa-solid fa-rotate-right"></i> Reset
                </a>
            </div>
        </form>

        <!-- Accounts Table -->
        <div class="card shadow">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Created At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${accounts == null || accounts.isEmpty()}">
                                <td colspan="7" class="text-center text-muted">
                                    <i class="fa-solid fa-inbox"></i> No accounts found
                                </td>
                            </tr>
                            <tr th:each="account : ${accounts}">
                                <td th:text="${account.accountId}"></td>
                                <td>
                                    <i class="fa-solid fa-user"></i>
                                    <span th:text="${account.username}"></span>
                                </td>
                                <td>
                                    <i class="fa-solid fa-envelope"></i>
                                    <span th:text="${account.email}"></span>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${account.role.name() == 'ADMIN' ? 'bg-danger' : account.role.name() == 'EVMSTAFF' ? 'bg-primary' : account.role.name() == 'DEALER' ? 'bg-success' : 'bg-info'}"
                                          th:text="${account.role.name()}">
                                    </span>
                                </td>
                                <td>
                                    <span th:if="${account.active}" class="badge bg-success">
                                        <i class="fa-solid fa-check-circle"></i> Active
                                    </span>
                                    <span th:unless="${account.active}" class="badge bg-secondary">
                                        <i class="fa-solid fa-ban"></i> Inactive
                                    </span>
                                </td>
                                <td th:text="${#dates.format(account.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/account/detail/{id}(id=${account.accountId})}"
                                           class="btn btn-sm btn-primary" title="View Details">
                                            <i class="fa-solid fa-eye"></i>
                                        </a>
                                        <a th:href="@{/account/edit/{id}(id=${account.accountId})}"
                                           class="btn btn-sm btn-warning" title="Edit">
                                            <i class="fa-solid fa-edit"></i>
                                        </a>
                                        <button type="button" class="btn btn-sm btn-danger"
                                                th:onclick="'confirmDelete(' + ${account.accountId} + ')'"
                                                title="Delete">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="text-muted mt-3">
                    <i class="fa-solid fa-info-circle"></i>
                    Total: <strong th:text="${accounts != null ? accounts.size() : 0}">0</strong> accounts
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">
                    <i class="fa-solid fa-exclamation-triangle"></i> Confirm Delete
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this account?</p>
                <p class="text-danger"><strong>⚠️ This action cannot be undone!</strong></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <form id="deleteForm" method="post" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger">
                        <i class="fa-solid fa-trash"></i> Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/menuProject.js"></script>
<script>
function confirmDelete(accountId) {
    const deleteForm = document.getElementById('deleteForm');
    deleteForm.action = '/account/delete/' + accountId;
    const modal = new bootstrap.Modal(document.getElementById('deleteModal'));
    modal.show();
}
</script>

</body>
</html>
