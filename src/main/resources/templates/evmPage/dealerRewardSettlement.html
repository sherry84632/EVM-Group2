<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Dealer Reward Settlement</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/homePageStyle.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <style>
        .status-badge { font-size:0.7rem; padding:4px 10px; border-radius:14px; letter-spacing:.5px; }
        .status-PENDING { background:#fff3cd; color:#856404; }
        .status-APPROVED { background:#cfe2ff; color:#084298; }
        .status-PAID { background:#d1e7dd; color:#0f5132; }
        .dealer-name { font-weight:600; }
        .table thead th { font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; }
        .collapse-box { background:#f8f9fa; }
        .num { text-align:right; font-variant-numeric: tabular-nums; }
        .reward-amt { font-weight:600; color:#0d6efd; }
    </style>
</head>
<body class="bg-light">
<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>
    <div class="mainContent flex-grow-1 p-3" style="overflow-y:auto; height:100vh;">
        <!-- Summary new -->
        <div class="row g-3 mb-3">
            <div class="col-md-3">
                <div class="card shadow-sm"><div class="card-body p-2"><small class="text-muted">Reward Total</small><div class="fw-bold" th:text="${@numberFormat.formatCurrency(totalReward)}">$0</div></div></div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm"><div class="card-body p-2"><small class="text-muted">Settled Amount</small><div class="fw-bold text-success" th:text="${@numberFormat.formatCurrency(totalPaid)}">$0</div></div></div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm"><div class="card-body p-2"><small class="text-muted">Remaining</small><div class="fw-bold text-danger" th:text="${@numberFormat.formatCurrency(totalRemain)}">$0</div></div></div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm"><div class="card-body p-2"><small class="text-muted">% Paid</small><div class="fw-bold" th:text="${#numbers.formatDecimal(percentPaid,2,0)} + '%'">0%</div></div></div>
            </div>
        </div>
        <div class="filter-bar mb-3">
            <form method="get" action="/evm/reward-settlement" class="row g-2 align-items-end">
                <div class="col-md-2">
                    <label class="form-label">Dealer</label>
                    <select name="dealerId" class="form-select">
                        <option value="" th:selected="${filterDealerId==null}">All Dealers</option>
                        <option th:each="d : ${dealers}" th:value="${d.dealerID}" th:text="${d.dealerName}" th:selected="${filterDealerId==d.dealerID}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Year</label>
                    <input name="year" type="number" min="2020" class="form-control" th:value="${filterYear}" />
                </div>
                <div class="col-md-2">
                    <label class="form-label">Month</label>
                    <select name="month" class="form-select">
                        <option value="" th:selected="${filterMonth==null}">All</option>
                        <option th:each="m : ${#numbers.sequence(1,12)}" th:value="${m}" th:text="${m}" th:selected="${filterMonth==m}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="" th:selected="${filterStatus == null || filterStatus == ''}">All</option>
                        <option value="PENDING" th:selected="${filterStatus == 'PENDING'}">PENDING</option>
                        <option value="APPROVED" th:selected="${filterStatus == 'APPROVED'}">APPROVED</option>
                        <option value="PAID" th:selected="${filterStatus == 'PAID'}">PAID</option>
                    </select>
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn btn-primary" type="submit"><i class="fa-solid fa-filter me-1"></i>Filter</button>
                </div>
            </form>
        </div>
        <div class="d-flex justify-content-end mb-2">
            <form method="post" action="/evm/reward-settlement/auto-generate-current">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="btn btn-dark btn-sm" type="submit"><i class="fa-solid fa-bolt me-1"></i>Auto Generate Current Month</button>
            </form>
        </div>
        <div class="card mb-4">
            <div class="card-body">
                <form method="post" action="/evm/reward-settlement/generate" class="row g-2">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="col-md-3">
                        <select name="dealerId" class="form-select" required>
                            <option value="" disabled selected>Choose Dealer...</option>
                            <option th:each="d : ${dealers}" th:value="${d.dealerID}" th:text="${d.dealerName}"></option>
                        </select>
                    </div>
                    <div class="col-md-2"><input name="year" type="number" min="2020" class="form-control" placeholder="Year" required /></div>
                    <div class="col-md-2">
                        <select name="month" class="form-select" required>
                            <option value="" disabled selected>Month...</option>
                            <option th:each="m : ${#numbers.sequence(1,12)}" th:value="${m}" th:text="${m}"></option>
                        </select>
                    </div>
                    <div class="col-md-3 d-grid"><button class="btn btn-success" type="submit"><i class="fa-solid fa-gears me-1"></i>Generate/Refresh</button></div>
                </form>
                <small class="text-muted">Reward = Imported Value (sum delivered purchase order subtotals) * RewardPercent / 100</small>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-sm align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th><th>Dealer</th><th>Period</th><th class="text-end">Reward %</th><th class="text-end">Original Reward</th><th class="text-end">Paid</th><th class="text-end">Remaining</th><th>Status</th><th>Notes</th><th>Pay</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${settlements}">
                    <td th:text="${s.rewardSettlementID}"></td>
                    <td th:text="${dealerMap[s.dealerID]} ?: 'Dealer '+ s.dealerID"></td>
                    <td th:text="${s.periodLabel}"></td>
                    <td class="num" th:text="${#numbers.formatDecimal(s.rewardPercent,2,'COMMA',2,'POINT')} + '%'">0%</td>
                    <td class="num" th:text="${#numbers.formatDecimal(s.rewardAmount,2,'COMMA',2,'POINT')}"></td>
                    <td class="num text-success" th:text="${#numbers.formatDecimal(s.reimbursedAmount,2,'COMMA',2,'POINT')}"></td>
                    <td class="num text-danger" th:text="${#numbers.formatDecimal(s.outstanding,2,'COMMA',2,'POINT')}"></td>
                    <td><span class="status-badge" th:classappend="' status-' + ${s.status}" th:text="${s.status}"></span>
                        <span th:if="${s.locked}" class="ms-1 text-muted small"><i class="fa-solid fa-lock"></i></span>
                        <div class="small text-muted" th:text="${#numbers.formatDecimal(s.percentPaid,2,0)} + '% paid'">0%</div>
                    </td>
                    <td th:text="${s.notes}"></td>
                    <td>
                        <form th:if="${!s.locked}" method="post" action="/evm/reward-settlement/partial-pay" class="d-flex flex-column gap-1 mb-1">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" name="id" th:value="${s.rewardSettlementID}" />
                            <div class="input-group input-group-sm">
                                <span class="input-group-text">Pay</span>
                                <input name="payAmount" type="number" step="0.01" min="0" th:attr="max=${s.outstanding}" class="form-control form-control-sm" placeholder="0.00" />
                            </div>
                            <input name="notes" class="form-control form-control-sm" th:value="${s.notes}" placeholder="Notes" />
                            <div class="d-flex gap-1">
                                <button class="btn btn-primary btn-sm flex-grow-1" type="submit"><i class="fa-solid fa-money-bill-transfer me-1"></i>Pay</button>
                                <form method="post" action="/evm/reward-settlement/pay-all">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <input type="hidden" name="id" th:value="${s.rewardSettlementID}" />
                                    <input type="hidden" name="notes" th:value="${s.notes}" />
                                    <button class="btn btn-outline-success btn-sm" type="submit" th:disabled="${s.outstanding.compareTo(T(java.math.BigDecimal).ZERO)==0}"><i class="fa-solid fa-check-double"></i>Pay All</button>
                                </form>
                            </div>
                        </form>
                        <div th:if="${s.locked}" class="text-muted small">Settlement completed.</div>
                    </td>
                </tr>
                <tr th:if="${settlements == null || settlements.isEmpty()}"><td colspan="10" class="text-center text-muted">No reward settlements.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>
</body>
</html>
