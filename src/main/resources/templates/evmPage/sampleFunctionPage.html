<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>

<body class="bg-gradient2-custom" style="overflow:hidden;">

<button class="mobile-menu-toggle" id="menuToggleBtn">
    <i class="fa-solid fa-bars"></i>
</button>

<div class="d-flex">

    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContent flex-grow-1 p-3" style="overflow: hidden">

        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/showEVMHomePage"><i class="fa-solid fa-home me-1"></i>Home</a></li>
                <li class="breadcrumb-item active" aria-current="page"><i class="fa-solid fa-flask me-1"></i>Sample</li>
            </ol>
        </nav>

        <div class="d-flex">
            <h2>This is a navigation link.</h2>
        </div>

        <div class="d-flex wrap">

            <span>
                <h1>Vehicle list</h1>
            </span>



        </div>

        <div class="scroll-box">

            <div th:each="vehicle : ${vehicleList}" class="d-flex" style="justify-content: center; align-items: center; padding: 35px;">
                <button class="button_vehicle_list" type="button">
                    <img src="/images/logo.png" th:alt="${vehicle.modelName} + ' image'" alt="Vehicle image" />
                    <span>
                        <strong th:text="${vehicle.modelName}"></strong><br/>
                        <span th:text="${T(utils.NumberFormatUtil).formatCurrency(vehicle.basePrice)}"></span><br/>
                        <span th:text="${vehicle.ManufactureYear}"></span>
                    </span>
                </button>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>

</body>

</html>
