<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/css/loginPage.css">
    <style>
        .flash-message { width:100%; margin:10px 0; padding:10px 14px; border-radius:10px; font-size:.9rem; animation:fadeIn .35s ease; }
        @keyframes fadeIn { from {opacity:0; transform:translateY(-6px);} to {opacity:1; transform:translateY(0);} }
        .logout-msg { background:#ffe3e3; border:1px solid #dc3545; color:#a40000; font-weight:600; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Login</h1>

        <!-- Error Message Display -->
        <div th:if="${errorMessage}" class="alert alert-danger flash-message" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Success Message Display -->
        <div th:if="${successMessage}" th:class="${successMessage}=='Đăng xuất thành công!' ? 'alert flash-message logout-msg' : 'alert alert-success flash-message'" role="alert">
            <span th:text="${successMessage}"></span>
        </div>

        <form action="/login" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="username">Email:</label>
                <input type="text" id="username" name="email" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>

    </div>

</body>
</html>
