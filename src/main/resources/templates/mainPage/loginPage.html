<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <style>
        /* Flash message styling */
        .flash-message { width:100%; margin-bottom:12px; animation:fadeIn .4s ease; border-radius:10px; }
        @keyframes fadeIn { from {opacity:0; transform:translateY(-6px);} to {opacity:1; transform:translateY(0);} }
        .logout-msg { background:#ffe3e3; border:1px solid #dc3545; color:#a40000; font-weight:600; }
        .logout-msg .close-btn { cursor:pointer; }
    </style>
</head>

<body class="bg-gradient1-custom">

    <div class="container-fluid mainContainer">

        <div class="container login-container">

            <div class="box loginBox bg-light border rounded-4 shadow">

                <img src="/images/logo.png" class="img-rounded" alt="Logo" width="200">

                <h3>LOGIN</h3>

                <!-- Error Message Display -->
                <div th:if="${errorMessage}" class="alert alert-danger flash-message" role="alert">
                    <span th:text="${errorMessage}"></span>
                </div>
                
                <!-- Success / Logout Message Display -->
                <div th:if="${successMessage}" th:class="${successMessage}=='Đăng xuất thành công!' ? 'alert flash-message logout-msg' : 'alert alert-success flash-message'" role="alert">
                    <span th:text="${successMessage}"></span>
                </div>

                <form action="/login" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input name="email" type="text" class="form-control rounded-input-bootstrap mb-1"
                        placeholder="Email">
                    <input name="password" type="password" class="form-control rounded-input-bootstrap mb-1"
                        placeholder="Password">
                    <button type="submit" class="btn btn-dark rounded-pill">Login</button>
                </form>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
