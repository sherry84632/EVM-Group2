<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>
<body class="bg-gradient2-custom">
<button class="mobile-menu-toggle" id="menuToggleBtn">
    <i class="fa-solid fa-bars"></i>
</button>
<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>
    <div class="mainContent flex-grow-1 p-3">
        <h1>Profile</h1>
        
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div th:if="${account}" class="row g-3">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fa-solid fa-user"></i> Account Information</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted">Account ID</label>
                                <div class="fw-semibold" th:text="${account.accountId}">-</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted">Username</label>
                                <div class="fw-semibold" th:text="${account.username}">-</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted">Email</label>
                                <div class="fw-semibold" th:text="${account.email}">-</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted">Role</label>
                                <div class="fw-semibold">
                                    <span class="badge bg-primary" th:text="${account.role}">-</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted">Status</label>
                                <div class="fw-semibold">
                                    <span th:if="${account.active}" class="badge bg-success">Active</span>
                                    <span th:unless="${account.active}" class="badge bg-danger">Inactive</span>
                                </div>
                            </div>
                            <div class="col-md-6" th:if="${account.createdAt}">
                                <label class="form-label text-muted">Created At</label>
                                <div class="fw-semibold" th:text="${#dates.format(account.createdAt, 'dd/MM/yyyy HH:mm')}">-</div>
                            </div>
                            <div class="col-md-6" th:if="${account.updatedAt}">
                                <label class="form-label text-muted">Updated At</label>
                                <div class="fw-semibold" th:text="${#dates.format(account.updatedAt, 'dd/MM/yyyy HH:mm')}">-</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12" sec:authorize="hasAnyRole('DEALER','DEALERSTAFF')" th:if="${account.dealerStaff}">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fa-solid fa-user-tie"></i> Staff Information</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted">Staff ID</label>
                                <div class="fw-semibold" th:text="${account.dealerStaff.staffID}">-</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted">Full Name</label>
                                <div class="fw-semibold" th:text="${account.dealerStaff.fullName}">-</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted">Position</label>
                                <div class="fw-semibold" th:text="${account.dealerStaff.position}">-</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted">Phone</label>
                                <div class="fw-semibold" th:text="${account.dealerStaff.phone}">-</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted">Email</label>
                                <div class="fw-semibold" th:text="${account.dealerStaff.email}">-</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12" sec:authorize="hasAnyRole('DEALER','DEALERSTAFF')" th:if="${account.dealerStaff != null and account.dealerStaff.dealer != null}">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fa-solid fa-store"></i> Dealer Information</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted">Dealer ID</label>
                                <div class="fw-semibold" th:text="${account.dealerStaff.dealer.dealerID}">-</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted">Dealer Name</label>
                                <div class="fw-semibold" th:text="${account.dealerStaff.dealer.dealerName}">-</div>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-muted">Address</label>
                                <div class="fw-semibold" th:text="${account.dealerStaff.dealer.address}">-</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted">Phone</label>
                                <div class="fw-semibold" th:text="${account.dealerStaff.dealer.phone}">-</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted">Email</label>
                                <div class="fw-semibold" th:text="${account.dealerStaff.dealer.email}">-</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>
</body>
</html>
