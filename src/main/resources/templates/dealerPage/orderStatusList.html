<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer Orders</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer"/>

    <style>
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 230px;
            background: #f8f9fa;
            color: #000000;
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: fixed;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
            border-right: 1px solid rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .sidebar h4 {
            color: #000000;
            font-weight: 700;
            text-align: center;
            width: 100%;
            margin-bottom: 25px;
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        .nav-link {
            width: 100%;
            display: flex;
            align-items: center;
            color: rgba(0, 0, 0, 0.7);
            font-weight: 600;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.2s ease;
            margin-bottom: 6px;
        }

        .nav-link i {
            margin-right: 10px;
            font-size: 1rem;
        }

        .nav-link:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #000000;
            transform: translateX(5px);
        }

        .nav-link.active {
            background: rgba(0, 0, 0, 0.1);
            color: #000000;
        }

        /* Main content */
        .mainContent {
            padding: 40px 40px 40px 280px;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        h2 {
            font-weight: 800;
            color: #000000;
            font-size: 2rem;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        h2::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: #000000;
            border-radius: 2px;
            margin-top: 6px;
        }

        /* Card grid layout */
        .order-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            padding: 15px;
        }

        /* Order card */
        .order-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .order-header h5 {
            color: #000000;
            font-weight: 700;
            font-size: 1.1rem;
            margin: 0;
        }

        /* Status badges */
        .badge-status {
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-pending {
            background: #fff3cd;
            color: #856404;
        }

        .badge-approved {
            background: #d4edda;
            color: #155724;
        }

        .badge-rejected, .badge-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-in-process {
            background: #cce5ff;
            color: #004085;
        }

        .badge-delivered {
            background: #d1ecf1;
            color: #0c5460;
        }

        .order-card p {
            margin: 8px 0;
            font-size: 0.95rem;
            color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
        }

        .order-card i {
            color: rgba(0, 0, 0, 0.5);
            width: 22px;
            text-align: center;
            margin-right: 8px;
            font-size: 1rem;
        }

        /* Scroll box */
        .scroll-box-order {
            width: 100%;
            height: 85vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        .scroll-box-order::-webkit-scrollbar {
            width: 8px;
        }

        .scroll-box-order::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        .scroll-box-order::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        /* Buttons */
        .btn-outline-dark {
            border: 1px solid rgba(0, 0, 0, 0.3);
            color: #000000;
            font-weight: 600;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn-outline-dark:hover {
            background: #000000;
            color: #ffffff;
        }
        .breadcrumb {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .breadcrumb-item {
            font-size: 14px;
            font-weight: 500;
        }

        .breadcrumb-item a {
            color: #6c757d;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .breadcrumb-item a:hover {
            color: #007bff;
        }

        .breadcrumb-item.active {
            color: #495057;
            font-weight: 600;
        }

        .breadcrumb-item + .breadcrumb-item::before {
            content: "›";
            color: #adb5bd;
            font-weight: bold;
            margin: 0 8px;
        }
    </style>

</head>

<body style="overflow: hidden">
<div class="d-flex">
    <!-- Sidebar -->
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <!-- Main content -->
    <div class="mainContent flex-grow-1 p-3" style="overflow: hidden;">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="/showDealerHomePage" class="d-flex align-items-center">
                        <i class="fas fa-home me-1"></i>
                        Home
                    </a>
                </li>
                <li class="breadcrumb-item">
                    <a href="/dealerVehiclesInformation">Vehicle Management</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                    <i class="fas fa-list me-1"></i>
                    Order Status
                </li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Order Status</h2>
            <a href="/orderdealer/choose" class="btn btn-dark rounded-pill px-4" style="display: inline-flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-plus"></i>
                Create New Order
            </a>
        </div>

        <!-- Message -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-check-circle me-2"></i>
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Orders -->
        <div class="scroll-box-order">
            <div th:if="${orders == null || #lists.isEmpty(orders)}" class="text-center mt-5 text-muted">
                <i class="fa-solid fa-box-open fa-3x mb-3"></i>
                <p>No orders have been created yet.</p>
                <p th:if="${message}" class="text-danger" th:text="${message}"></p>
            </div>

            <div th:if="${orders != null && !#lists.isEmpty(orders)}" class="order-grid">
                <div th:each="order : ${orders}" class="order-card">
                    <div class="order-header">
                        <h5>Order #<span th:text="${order.purchaseOrderId}"></span></h5>
                        <span class="badge-status"
                              th:classappend="${order.status.name() == 'REQUESTED'} ? ' badge-pending' :
                                              (${order.status.name() == 'APPROVED'} ? ' badge-approved' :
                                              (${order.status.name() == 'IN_PROCESS'} ? ' badge-in-process' :
                                              (${order.status.name() == 'DELIVERED'} ? ' badge-delivered' : ' badge-cancelled')))"
                              th:text="${order.status}"></span>
                    </div>
                    <hr class="my-2">
                    <p><i class="fa-solid fa-building me-2"></i> Dealer: <span th:text="${order.dealer?.dealerName ?: 'N/A'}"></span></p>
                    <p><i class="fa-solid fa-id-badge me-2"></i> Dealer ID: <span th:text="${order.dealer?.dealerID ?: 'N/A'}"></span></p>
                    <p><i class="fa-solid fa-user me-2"></i> Staff: <span th:text="${order.staff?.fullName ?: 'N/A'}"></span></p>
                    <p><i class="fa-solid fa-id-card me-2"></i> Staff ID: <span th:text="${order.staff?.staffID ?: 'N/A'}"></span></p>
                    <p><i class="fa-solid fa-dollar-sign me-2"></i> Total:
                        <span th:text="${order.totalAmount != null ? #numbers.formatCurrency(order.totalAmount) : '$0.00'}"></span>
                    </p>
                    <p><i class="fa-solid fa-calendar-day me-2"></i>
                        <span th:text="${#dates.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                    </p>
                    <div class="mt-3 d-flex gap-2">
                        <a th:href="@{/orderdealer/detail/{id}(id=${order.purchaseOrderId})}"
                           class="btn btn-sm btn-outline-dark flex-fill">
                            <i class="fa-solid fa-eye me-1"></i> View Details
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
