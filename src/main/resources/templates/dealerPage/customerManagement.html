<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContent flex-grow-1 p-4">

        <h1 class="mb-4"><i class="fas fa-users"></i> Customer Management</h1>

        <div class="alert alert-info">
            <i class="fas fa-info-circle"></i>
            <strong>Manage your customers</strong><br>
            View, create, and manage customer information for your dealership.
        </div>

        <!-- Icon buttons matching DealerHomePage style -->
        <div class="d-flex wrap justify-content-center mt-5">
            <div class="d-flex" style="justify-content: center; align-items: center; padding: 35px;">
                <a href="/betterCustomerListFinal" style="text-decoration: none;">
                    <button class="icon-btn">
                        <i class="fa-solid fa-list-check"></i>
                        <span>
                            View Customer List
                        </span>
                    </button>
                </a>
            </div>

            <div class="d-flex" style="justify-content: center; align-items: center; padding: 35px;">
                <a href="/dealerCreateANewCustomer" style="text-decoration: none;">
                    <button class="icon-btn">
                        <i class="fa-solid fa-user-plus"></i>
                        <span>
                            Create New Customer
                        </span>
                    </button>
                </a>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
