<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <style>
        .breadcrumb {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .breadcrumb-item {
            font-size: 14px;
            font-weight: 500;
        }

        .breadcrumb-item a {
            color: #6c757d;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .breadcrumb-item a:hover {
            color: #007bff;
        }

        .breadcrumb-item.active {
            color: #495057;
            font-weight: 600;
        }

        .breadcrumb-item + .breadcrumb-item::before {
            content: "›";
            color: #adb5bd;
            font-weight: bold;
            margin: 0 8px;
        }
    </style>
</head>

<body class="bg-gradient2-custom">

<button class="mobile-menu-toggle" id="menuToggleBtn">
    <i class="fa-solid fa-bars"></i>
</button>

<div class="d-flex">

    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContent flex-grow-1 p-3">

        <div class="d-flex wrap">

            <div class="d-flex" style="justify-content: center; align-items: center; padding: 35px;">
                <a href="/dealerCreateANewCustomer" style="text-decoration: none;">
                    <button class="icon-btn">
                        <i class="fa-solid fa-list-check"></i>
                        <span>
                            Create a new customer
                        </span>
                    </button>
                </a>
            </div>

            <div class="d-flex" style="justify-content: center; align-items: center; padding: 35px;">
                <a href="/customer" style="text-decoration: none;">
                    <button class="icon-btn">
                        <i class="fa-solid fa-circle-info"></i>
                        <span>
                            Customer List
                        </span>
                    </button>
                </a>
            </div>

            <div class="d-flex" style="justify-content: center; align-items: center; padding: 35px;">
                <a href="/saleorder" style="text-decoration: none;">
                    <button class="icon-btn">
                        <i class="fa-solid fa-clipboard-list"></i>
                        <span>
                            Customer Order
                        </span>
                    </button>
                </a>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>

</body>

</html>
