<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="/css/inentoryScrollBox.css">
    <style>
        .breadcrumb {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .breadcrumb-item {
            font-size: 14px;
            font-weight: 500;
        }

        .breadcrumb-item a {
            color: #6c757d;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .breadcrumb-item a:hover {
            color: #007bff;
        }

        .breadcrumb-item.active {
            color: #495057;
            font-weight: 600;
        }

        .breadcrumb-item + .breadcrumb-item::before {
            content: "›";
            color: #adb5bd;
            font-weight: bold;
            margin: 0 8px;
        }
        .card {
            margin-bottom: 12px;
        }
    </style>

</head>

<body class="bg-gradient2-custom">

<button class="mobile-menu-toggle" id="menuToggleBtn">
    <i class="fa-solid fa-bars"></i>
</button>

<div class="d-flex">

    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContent flex-grow-1 p-3" style="overflow: hidden">

        <div class="d-flex">

            <div class="container-fluid" style="height: 90vh; overflow-y: auto; overflow-x: hidden;">

                <div class="row">

                    <div class="col-md-12">
                        <nav aria-label="breadcrumb" class="mb-4">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item">
                                    <a href="/showDealerHomePage" class="d-flex align-items-center">
                                        <i class="fas fa-home me-1"></i>
                                        Home
                                    </a>
                                </li>
                                <li class="breadcrumb-item">
                                    <a href="/dealerCustomerManagement">Customer Management</a>
                                </li>
                                <li class="breadcrumb-item active" aria-current="page">
                                    <i class="fas fa-list me-1"></i>
                                    Customer Orders
                                </li>
                            </ol>
                        </nav>
                    </div>

                </div>

                <div class="row">
                    <div class="col-md-12">
                        <div class="card shadow">
                            <div class="card-body">
                                <form action="/saleorder" method="get">
                                    <div class="row g-3 align-items-end">

                                        <div class="row">
                                            <!-- Column 1 -->
                                            <div class="col-md-3">
                                                <label>Customer Name</label>
                                                <input name="keyword" type="text" class="form-control" placeholder="Type customer name" th:value="${keyword}">
                                            </div>

                                            <!-- Column 2 -->
                                            <div class="col-md-3">
                                                <label class="form-label">From</label>
                                                <input name="from" type="date" class="form-control" th:value="${from}">
                                            </div>

                                            <!-- Column 3 -->
                                            <div class="col-md-3">
                                                <label class="form-label">To</label>
                                                <input name="to" type="date" class="form-control" th:value="${to}">
                                            </div>

                                            <!-- Column 4 (Status + Apply button) -->
                                            <div class="col-md-3">
                                                <label class="form-label">Status</label>
                                                <select name="status" class="form-select mb-2" th:value="${status}">
                                                    <option value="">All</option>
                                                    <option value="CREATED">CREATED</option>
                                                    <option value="CONTRACT_SIGNED">CONTRACT_SIGNED</option>
                                                    <option value="PROCESSING">PROCESSING</option>
                                                    <option value="SHIPPED">SHIPPED</option>
                                                    <option value="COMPLETED">COMPLETED</option>
                                                    <option value="CANCELLED">CANCELLED</option>
                                                </select>

                                                <button type="submit" class="btn btn-primary w-100">Apply</button>
                                            </div>
                                        </div>

                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="row">
                    <div th:each="order : ${orders}" class="col-md-6">

                        <!-- Item  -->
                        <div class="card shadow">
                            <div class="card-header">
                                <div class="model-name">
                                    Order ID: <span th:text="${order.saleOrderID}"></span>
                                </div>
                            </div>
                            <div class="card-body">
                                <a th:href="@{/saleorder/detail/{id}(id=${order.saleOrderID})}" style="text-decoration: none">
                                    <div class="row">
                                        <div class="col-md-3">
                                            <div class="image-placeholder">
                                                <i class="fa-solid fa-clipboard-list"></i>
                                            </div>
                                        </div>

                                        <div class="col-md-6">
                                            <div class="item-info">
                                                <div class="info-row">
                                                    <div class="info-item">
                                                        <span class="info-label">Created date:</span>
                                                        <span class="info-value" th:text="${#dates.format(order.createdAt,'dd/MM/yyyy HH:mm')}"></span>
                                                    </div>
                                                    <div class="info-item">
                                                        <span class="info-label">Quantity:</span>
                                                        <span class="info-value" th:text="${order.totalQuantity}"></span>
                                                    </div>
                                                </div>
                                                <div class="info-row">
                                                    <div class="info-item">
                                                        <span class="info-label">Status:</span>
                                                        <span class="info-value" th:text="${order.status}"></span>
                                                    </div>
                                                    <div class="info-item">
                                                        <span class="info-label">Total:</span>
                                                        <span class="info-value" th:text="'$' + ${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')}"></span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-md-3" style="display: flex; flex-direction: column;">
                                            <form th:action="@{/saleorder/delete/{id}(id=${order.saleOrderID})}" method="post" class="mt-1" th:onsubmit="|return confirm('Delete sale order #${order.saleOrderID} ?')|">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <button type="submit" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i> Delete</button>
                                            </form>
                                        </div>
                                    </div>
                                </a>

                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>

</body>

</html>
