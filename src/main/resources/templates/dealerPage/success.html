<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Success</title>
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <style>
        .success-container {
            max-width: 600px;
            margin: 80px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .success-icon {
            font-size: 80px;
            color: #28a745;
            margin-bottom: 20px;
        }

        .success-message {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 30px;
        }

        .btn-action {
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
    </style>
</head>
<body class="bg-gradient2-custom">

<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContent flex-grow-1 p-5">
        <div class="success-container">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>

            <div class="success-message" th:text="${message}">
                Order created successfully!
            </div>

            <div class="d-flex flex-column gap-3 align-items-center">
                <!-- Nếu có orderId, hiển thị link đến order detail -->
                <a th:if="${orderId != null}"
                   th:href="@{/orderdealer/detail/{id}(id=${orderId})}"
                   class="btn btn-action btn-primary-custom">
                    <i class="fas fa-file-invoice"></i>
                    View Order Details
                </a>

                <!-- Link về danh sách orders -->
                <a href="/orderdealer" class="btn btn-action btn-outline-dark">
                    <i class="fas fa-list"></i>
                    Go to Order List
                </a>

                <!-- Link tạo order mới -->
                <a href="/orderdealer/choose" class="btn btn-action btn-outline-secondary">
                    <i class="fas fa-plus"></i>
                    Create Another Order
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
