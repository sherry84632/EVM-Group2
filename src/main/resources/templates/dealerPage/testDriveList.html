<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Test Drives</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" th:href="@{/css/mainPageStyle.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <style>
        .card-box{background:#fff; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.08); padding:16px; margin-bottom:20px;}
        table{width:100%; border-collapse:collapse;}
        th,td{border:1px solid #e2e2e2; padding:6px 8px; font-size:13px;}
        th{background:#f5f5f5;}
        .badge-status{display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600;}
        .s-NOT_YET{background:#ffe8cc; color:#b85d00;} .s-TODAY{background:#fff3cd; color:#856404;} .s-ATTENDED{background:#d1e7dd; color:#0f5132;} .s-NOT_ATTENDED{background:#f8d7da; color:#842029;}
        .filter-bar select{padding:6px; font-size:13px;}
        .filter-bar{display:flex; gap:12px; flex-wrap:wrap;}
    </style>
</head>
<body class="bg-gradient2-custom">
<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>
    <div class="mainContent flex-grow-1 p-3">
        <h3>Test Drive Management</h3>
        <div th:if="${message}" class="alert alert-success py-1" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger py-1" th:text="${error}"></div>
        <div class="card-box">
            <h5>Schedule New</h5>
            <form th:action="@{/testdrive/create}" method="post" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label" style="font-size:12px;">Customer</label>
                    <select class="form-select form-select-sm" name="customerID" required>
                        <option th:each="c : ${customers}" th:value="${c.customerID}" th:text="${c.fullName}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" style="font-size:12px;">Vehicle (optional)</label>
                    <select class="form-select form-select-sm" name="vehicleID">
                        <option value="">--None--</option>
                        <option th:each="v : ${vehicles}" th:value="${v.vehicleID}" th:text="${'#'+v.vehicleID}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" style="font-size:12px;">Date & Time</label>
                    <input class="form-control form-control-sm" type="datetime-local" name="testDateTime" required />
                </div>
                <div class="col-md-3">
                    <label class="form-label" style="font-size:12px;">Feedback (optional)</label>
                    <input class="form-control form-control-sm" type="text" name="feedback" />
                </div>
                <div class="col-12">
                    <button class="btn btn-primary btn-sm" type="submit">Schedule</button>
                </div>
            </form>
        </div>
        <div class="card-box">
            <h5>Test Drive List</h5>
            <form th:action="@{/testdrive/list}" method="get" class="filter-bar mb-2">
                <div>
                    <label style="font-size:12px;">Status</label>
                    <select name="status">
                        <option value="" th:selected="${statusFilter == null || statusFilter == ''}">All</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${statusFilter==s}"></option>
                    </select>
                </div>
                <div>
                    <label style="font-size:12px;">Sort</label>
                    <select name="sort">
                        <option value="asc" th:selected="${sortDir=='asc'}">Ascending</option>
                        <option value="desc" th:selected="${sortDir=='desc'}">Descending</option>
                    </select>
                </div>
                <div style="align-self:flex-end;">
                    <button class="btn btn-secondary btn-sm" type="submit">Apply</button>
                </div>
            </form>
            <table>
                <thead><tr><th>ID</th><th>Customer</th><th>Date & Time</th><th>Status</th><th>Feedback</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="d : ${drives}">
                    <td th:text="${d.testDriveID}"></td>
                    <td th:text="${d.customer.fullName}"></td>
                    <td th:text="${#dates.format(d.testDate,'yyyy-MM-dd HH:mm')}"></td>
                    <td><span th:text="${d.status}" th:class="${'badge-status s-' + d.status}"></span></td>
                    <td th:text="${d.feedback}" style="max-width:160px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></td>
                    <td>
                        <form th:action="@{/testdrive/status}" method="post" style="display:inline">
                            <input type="hidden" name="testDriveID" th:value="${d.testDriveID}" />
                            <select name="status" style="padding:2px; font-size:11px;">
                                <option value="NOT_YET" th:selected="${d.status=='NOT_YET'}">NOT_YET</option>
                                <option value="TODAY" th:selected="${d.status=='TODAY'}">TODAY</option>
                                <option value="ATTENDED" th:selected="${d.status=='ATTENDED'}">ATTENDED</option>
                                <option value="NOT_ATTENDED" th:selected="${d.status=='NOT_ATTENDED'}">NOT_ATTENDED</option>
                            </select>
                            <button class="btn btn-sm btn-success" type="submit">Update</button>
                        </form>
                        <form th:action="@{/testdrive/delete}" method="post" style="display:inline" onsubmit="return confirm('Delete test drive?')">
                            <input type="hidden" name="testDriveID" th:value="${d.testDriveID}" />
                            <button class="btn btn-sm btn-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${drives == null || #lists.isEmpty(drives)}"><td colspan="6" class="text-center py-2">No test drives</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
