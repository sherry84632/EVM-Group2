<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Dealer Model Prices</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/homePageStyle.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <style>
        .model-card{border:1px solid #e5e7eb;border-radius:12px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.06);background:#fff;transition:.2s}
        .model-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.12)}
        .model-card .card-header{background:#f8f9fa;border-bottom:1px solid #e5e7eb;border-top-left-radius:12px;border-top-right-radius:12px;padding:.55rem .9rem;display:flex;justify-content:space-between;align-items:center}
        .price-badge{display:inline-block;padding:4px 10px;background:#0d6efd;color:#fff;border-radius:20px;font-size:.7rem;font-weight:600;letter-spacing:.5px}
        .dealer-price-tag{background:#198754;color:#fff;padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:600;letter-spacing:.5px}
        .model-meta{font-size:.75rem;color:#6c757d;display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
        .model-meta span{display:inline-flex;align-items:center;gap:4px}
        .edit-box{background:#f1f5f9;padding:10px;border-radius:10px;margin-top:8px}
        .edit-box input{font-size:.8rem}
        .edit-box .current{font-size:.7rem;color:#495057;margin-top:4px}
        .grid-wrapper{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
        .alert{border-radius:10px}
        .image-placeholder{display:flex;justify-content:center;align-items:center;width:100%;height:100px;background:#f1f3f5;border:1px dashed #ced4da;border-radius:10px;overflow:hidden;position:relative}
        .image-placeholder span{font-size:42px;color:#adb5bd}
        .vehicle-image{width:100%;height:100%;object-fit:cover;display:block}
    </style>
</head>
<body class="bg-gradient2-custom">
<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>
    <div class="mainContent flex-grow-1 p-3" style="overflow-y:auto;height:97vh;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Model Selling Prices</h5>
            <span class="text-muted small" th:if="${!canEdit}">Read-only</span>
        </div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <!-- Cards -->
        <div class="grid-wrapper" th:if="${models != null and !models.isEmpty()}">
            <div class="model-card" th:each="m : ${models}">
                <div class="card-header">
                    <div class="fw-semibold" th:text="${m.modelName}">Model Name</div>
                    <div class="price-badge" th:title="${@numberFormat.formatCurrency(m.basePrice)}" th:text="${@numberFormat.formatCompactCurrency(m.basePrice)}">$0</div>
                </div>
                <div class="p-2">
                    <div class="row g-2 align-items-stretch">
                        <div class="col-4 col-md-3">
                            <div class="image-placeholder">
                                <img th:if="${m.modelID != null}" th:src="@{/evm/vehicle/modelImage/{id}(id=${m.modelID})}" alt="Model Image" class="vehicle-image"
                                     onload="this.nextElementSibling && (this.nextElementSibling.style.display='none')"
                                     onerror="this.style.display='none'; this.nextElementSibling && (this.nextElementSibling.style.display='flex')"/>
                                <span>🚗</span>
                            </div>
                        </div>
                        <div class="col-8 col-md-9 d-flex flex-column">
                            <div class="model-meta mb-2">
                                <span><i class="fa fa-industry text-secondary"></i><span th:text="${m.brand}">Brand</span></span>
                                <span><i class="fa fa-calendar text-secondary"></i><span th:text="${m.year}">Year</span></span>
                                <span th:if="${m.dealerPrice != null}"><i class="fa fa-tag text-success"></i><span class="dealer-price-tag" th:title="${@numberFormat.formatCurrency(m.dealerPrice)}" th:text="${@numberFormat.formatCompactCurrency(m.dealerPrice)}">$0</span></span>
                                <span th:if="${m.dealerPrice == null}"><i class="fa fa-tag text-muted"></i><span class="text-muted">No dealer price</span></span>
                            </div>
                            <div class="edit-box mt-auto" th:if="${canEdit}">
                                <form th:action="@{/dealer/model-prices/update}" method="post" class="d-flex flex-column gap-1">
                                    <input type="hidden" name="modelId" th:value="${m.modelID}" />
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <label class="form-label mb-0" style="font-size:.65rem;letter-spacing:.5px;text-transform:uppercase">New Dealer Price</label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text">$</span>
                                        <input type="number" step="0.01" min="0" name="price" class="form-control" th:placeholder="${m.dealerPrice != null ? m.dealerPrice : m.basePrice}"/>
                                        <button type="submit" class="btn btn-success">Save</button>
                                    </div>
                                    <div class="current">Current: <span th:text="${m.dealerPrice != null ? @numberFormat.formatCurrency(m.dealerPrice) : @numberFormat.formatCurrency(m.basePrice)}">$0</span></div>
                                </form>
                            </div>
                            <div class="text-muted small mt-2" th:if="${!canEdit}">Current Dealer Price: <strong th:text="${m.dealerPrice != null ? @numberFormat.formatCurrency(m.dealerPrice) : '—'}">—</strong></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card p-4" th:if="${models == null or models.isEmpty()}">
            <h6 class="text-muted mb-1"><i class="fa fa-box-open me-2"></i>No models found</h6>
            <p class="small text-muted mb-0">Import vehicles first to configure selling prices.</p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>
</body>
</html>
