<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContent flex-grow-1 p-4">

        <div class="container-fluid">

            <h1 class="mb-4">
                <i class="fas fa-history me-2"></i>Order History
            </h1>

            <!-- Alert Message -->
            <div th:if="${message}" class="alert alert-info alert-dismissible fade show" role="alert">
                <i class="fas fa-info-circle me-2"></i>
                <span th:text="${message}">Message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Search Bar -->
            <div class="card mb-4">
                <div class="card-body">
                    <form method="get" action="/orderdealer/history" class="row g-3">
                        <div class="col-md-10">
                            <input type="text"
                                   name="keyword"
                                   class="form-control"
                                   placeholder="Search by Order ID or Status..."
                                   th:value="${keyword}">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-search me-1"></i> Search
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-list me-2"></i>Completed Orders History</h5>
                </div>
                <div class="card-body">
                    <div th:if="${orders == null or orders.isEmpty()}" class="text-center text-muted py-5">
                        <i class="fas fa-inbox fa-3x mb-3"></i>
                        <p class="fs-5">No order history found.</p>
                        <a href="/orderdealer/choose" class="btn btn-primary">
                            <i class="fas fa-plus me-1"></i> Place New Order
                        </a>
                    </div>

                    <div th:if="${orders != null and !orders.isEmpty()}" class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>Order ID</th>
                                    <th>Created Date</th>
                                    <th>Total Amount</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="order : ${orders}">
                                    <td>
                                        <strong>#<span th:text="${order.purchaseOrderId}">1</span></strong>
                                    </td>
                                    <td th:text="${#dates.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2025</td>
                                    <td>
                                        <strong class="text-success">
                                            $<span th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')}">0</span>
                                        </strong>
                                    </td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${order.status.name() == 'DELIVERED' ? 'bg-success' :
                                                              (order.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-secondary')}"
                                              th:text="${order.status}">
                                            Status
                                        </span>
                                    </td>
                                    <td>
                                        <a th:href="@{/orderdealer/detail/{id}(id=${order.purchaseOrderId})}"
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="fas fa-eye me-1"></i> View Details
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Back Button -->
            <div class="mt-4">
                <a href="/dealerVehiclesInformation" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-1"></i> Back to Vehicle Information
                </a>
                <a href="/orderdealer" class="btn btn-outline-primary ms-2">
                    <i class="fas fa-clipboard-list me-1"></i> View Active Orders
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>
</body>
</html>
