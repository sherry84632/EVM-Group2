<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Complaints</title>
    <link rel="stylesheet" th:href="@{/css/mainPageStyle.css}" />
    <link rel="stylesheet" th:href="@{/css/iconStyle.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <style>
        /* Simple layout */
        body { font-family: Arial, sans-serif; }
        .layout { display:flex; }
        .content { flex:1; padding:18px; }
        h2 { margin-top:0; }
        table { width:100%; border-collapse:collapse; }
        th, td { border:1px solid #ddd; padding:6px 8px; font-size:13px; }
        th { background:#f3f3f3; text-align:left; }
        .status-APPROVED { color:#0d6efd; font-weight:600; }
        .status-PROCESSED { color:#198754; font-weight:600; }
        .msg { padding:6px 10px; margin-bottom:10px; border-radius:4px; }
        .msg.success { background:#e8f9e9; border:1px solid #198754; }
        .msg.error { background:#fde5e5; border:1px solid #dc3545; }
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:12px; }
        .top-bar form { display:flex; gap:6px; }
        input[type=text] { padding:6px; border:1px solid #ccc; border-radius:4px; }
        .btn { background:#0d6efd; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px; text-decoration:none; display:inline-block; }
        .btn.secondary { background:#6c757d; }
        .btn.danger { background:#dc3545; }
        .btn:hover { opacity:.9; }
        .actions form { display:inline; }
        .ellipsis { max-width:250px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    </style>
</head>
<body class="bg-gradient2-custom">
<div class="d-flex">
    <!-- Right sidebar -->
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>
    <!-- Main content -->
    <div class="mainContent flex-grow-1 p-3" style="background:#fff; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.08);">
        <h2 style="margin-top:4px;">Customer Complaints</h2>
        <div th:if="${message}" class="msg success" th:text="${message}"></div>
        <div th:if="${error}" class="msg error" th:text="${error}"></div>
        <div class="top-bar">
            <form th:action="@{/complaint/list}" method="get">
                <input type="text" name="keyword" placeholder="Search name or note" th:value="${keyword}" />
                <button type="submit" class="btn secondary">Search</button>
            </form>
            <a th:href="@{/complaint/create}" class="btn">+ New Complaint</a>
        </div>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Date</th>
                <th>Status</th>
                <th>Note</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${complaints}">
                <td th:text="${c.complaintID}"></td>
                <td th:text="${c.customerName}"></td>
                <td th:text="${c.complaintDate}"></td>
                <td th:text="${c.status}" th:class="${'status-' + c.status}"></td>
                <td th:text="${c.note}" class="ellipsis"></td>
                <td class="actions">
                    <a th:href="@{'/complaint/edit/' + ${c.complaintID}}" class="btn secondary">Edit</a>
                    <form th:action="@{'/complaint/delete/' + ${c.complaintID}}" method="post" onsubmit="return confirm('Delete?');">
                        <button type="submit" class="btn danger">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${complaints == null || #lists.isEmpty(complaints)}">
                <td colspan="6" style="text-align:center; padding:15px;">No complaints</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
