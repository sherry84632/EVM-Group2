<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quotation Line Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <style>
        .line-card { background:#fff; border-radius:16px; padding:24px; box-shadow:0 4px 18px rgba(0,0,0,.08); margin-bottom:24px; }
        .info-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f1f3f5; }
        .info-row:last-child { border-bottom:none; }
        .info-label { font-weight:600; color:#495057; }
        .info-value { color:#212529; }
        .price-box { background:#f8f9fa; border-radius:12px; padding:16px; }
        .price-box .info-row { border-bottom: none; }
        .title-icon { color:#0d6efd; }
        .badge-status { padding:6px 12px; border-radius:20px; font-size:.7rem; font-weight:600; letter-spacing:.5px; }
        .badge-pending { background:#fff3cd; color:#856404; }
        .badge-approved { background:#d4edda; color:#155724; }
        .badge-rejected { background:#f8d7da; color:#721c24; }
    </style>
</head>
<body class="bg-gradient2-custom">
<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>
    <div class="mainContent flex-grow-1 p-4" style="overflow-y:auto; min-height:100vh;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0"><i class="fas fa-car title-icon me-2"></i>Quotation Line Detail</h2>
            <a th:href="@{'/quotation/detail/' + ${detail.quotation.quotationID}}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-2"></i>Back to Quotation
            </a>
        </div>
        <div th:if="${error}" class="alert alert-danger"><i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span></div>
        <div th:if="${detail}" class="line-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Line #<span th:text="${detail.quotationDetailID}"></span></h5>
                <span class="badge-status" th:classappend="${detail.quotation.status.name()=='CREATED'?' badge-pending':(detail.quotation.status.name()=='APPROVED'?' badge-approved':(detail.quotation.status.name()=='REJECTED'?' badge-rejected':' badge-pending'))}" th:text="${detail.quotation.status.name()=='CREATED'?'PENDING':detail.quotation.status.name()}"></span>
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="info-row"><span class="info-label">Model:</span><span class="info-value" th:text="${detail.modelName ?: 'N/A'}"></span></div>
                    <div class="info-row"><span class="info-label">Version:</span><span class="info-value" th:text="${detail.versionName ?: 'N/A'}"></span></div>
                    <div class="info-row"><span class="info-label">Color:</span><span class="info-value" th:text="${detail.colorName ?: 'N/A'}"></span></div>
                    <div class="info-row"><span class="info-label">Quantity:</span><span class="info-value" th:text="${detail.quantity}"></span></div>
                </div>
                <div class="col-md-6">
                    <div class="info-row"><span class="info-label">Unit Price:</span><span class="info-value" th:text="${#numbers.formatDecimal(detail.unitPrice,0,'COMMA',0,'POINT') + ' VND'}"></span></div>
                    <div class="info-row"><span class="info-label">Subtotal (Gross):</span><span class="info-value" th:text="${#numbers.formatDecimal(gross,0,'COMMA',0,'POINT') + ' VND'}"></span></div>
                    <div class="info-row"><span class="info-label">Discount % (Quotation):</span><span class="info-value" th:text="${discountPercent + '%'}"></span></div>
                    <div class="info-row"><span class="info-label">Net After Discount:</span><span class="info-value fw-semibold" th:text="${#numbers.formatDecimal(net,0,'COMMA',0,'POINT') + ' VND'}"></span></div>
                </div>
            </div>
            <hr>
            <form th:action="@{/quotation/detail/quantity}" method="post" class="d-flex align-items-end gap-2 mb-3">
                <div>
                    <label class="form-label mb-1">Update Quantity</label>
                    <input type="number" min="1" name="quantity" class="form-control form-control-sm" th:value="${detail.quantity}">
                    <input type="hidden" name="quotationDetailID" th:value="${detail.quotationDetailID}">
                    <input type="hidden" name="quotationID" th:value="${detail.quotation.quotationID}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                </div>
                <button type="submit" class="btn btn-sm btn-primary"><i class="fas fa-save me-1"></i>Save</button>
            </form>
            <form th:action="@{/quotation/detail/delete}" method="post" onsubmit="return confirm('Delete this line? This cannot be undone.')">
                <input type="hidden" name="quotationDetailID" th:value="${detail.quotationDetailID}" />
                <input type="hidden" name="quotationID" th:value="${detail.quotation.quotationID}" />
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-sm btn-danger"><i class="fas fa-trash me-1"></i>Delete Line</button>
            </form>
        </div>
        <div th:if="${detail == null and error == null}" class="alert alert-warning">No detail data provided.</div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>
</body>
</html>
