<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="/css/discountManagement.css">
    <link rel="stylesheet" href="/css/discountScrollBox.css">
    <style>
        .phase-badge {padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;letter-spacing:.5px;}
        .phase-PENDING {background:#fff3cd;color:#856404;}
        .phase-SCHEDULED {background:#e7f5ff;color:#0b7285;}
        .phase-IN_TRANSIT {background:#dbe4ff;color:#364fc7;}
        .phase-NEAR_DELIVERY {background:#ffd8a8;color:#d9480f;}
        .phase-DELIVERED {background:#d3f9d8;color:#2b8a3e;}
        .progress {height:14px;border-radius:10px;background:#f1f3f5;}
        .progress-bar {background:linear-gradient(90deg,#4dabf7,#1971c2);font-size:10px;font-weight:600;}
        .remaining-days {font-weight:600;color:#0b7285;}
        .status-badge{padding:6px 12px;border-radius:14px;font-size:12px;font-weight:600;letter-spacing:.5px;display:inline-block;}
        .st-CREATED{background:#fff3cd;color:#856404;} .st-CONTRACT_SIGNED{background:#e7f5ff;color:#0b7285;} .st-PROCESSING{background:#dbe4ff;color:#364fc7;} .st-SHIPPED{background:#ffd8a8;color:#d9480f;} .st-COMPLETED{background:#d3f9d8;color:#2b8a3e;} .st-CANCELLED{background:#ffe3e3;color:#c92a2a;}
        .status-actions form{display:inline-block;margin:2px;}
    </style>
</head>

<body class="bg-gradient2-custom" style="overflow:hidden;">

<button class="mobile-menu-toggle" id="menuToggleBtn">
    <i class="fa-solid fa-bars"></i>
</button>

<div class="d-flex">

    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContentVer">

        <div class="left-column">

            <div class="form-wrapper">
                <h1>Basic Infos</h1>
                <div class="form-group">
                    <label>Sale order id</label>
                    <input type="text" th:value="${order.saleOrderID}" readonly>
                </div>
                <div class="form-group">
                    <label>Dealer id</label>
                    <input type="text" th:value="${order.dealer.dealerID}" readonly>
                </div>
                <div class="form-group">
                    <label>Dealer staff id</label>
                    <input type="text" th:value="${order.staff.staffID}" readonly>
                </div>
                <div class="form-group">
                    <label>Created at</label>
                    <input type="text" th:value="${order.createdAt}" readonly>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <div class="status-badge" th:classappend="' st-' + ${order.status.name()}" th:text="${order.status.name()}"></div>
                </div>
                <div class="status-actions">
                    <form th:action="@{/saleorder/updateStatus}" method="post" th:if="${order.status.name()=='CREATED'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="saleOrderID" th:value="${order.saleOrderID}">
                        <input type="hidden" name="status" value="CONTRACT_SIGNED">
                        <button class="btn btn-sm btn-outline-primary" type="submit">Mark Contract Signed</button>
                    </form>
                    <form th:action="@{/saleorder/updateStatus}" method="post" th:if="${order.status.name()=='CONTRACT_SIGNED'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="saleOrderID" th:value="${order.saleOrderID}">
                        <input type="hidden" name="status" value="PROCESSING">
                        <button class="btn btn-sm btn-outline-primary" type="submit">Start Processing</button>
                    </form>
                    <form th:action="@{/saleorder/updateStatus}" method="post" th:if="${order.status.name()=='PROCESSING'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="saleOrderID" th:value="${order.saleOrderID}">
                        <input type="hidden" name="status" value="SHIPPED">
                        <button class="btn btn-sm btn-outline-warning" type="submit">Mark Shipped</button>
                    </form>
                    <form th:action="@{/saleorder/updateStatus}" method="post" th:if="${order.status.name()=='SHIPPED'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="saleOrderID" th:value="${order.saleOrderID}">
                        <input type="hidden" name="status" value="COMPLETED">
                        <button class="btn btn-sm btn-outline-success" type="submit">Mark Completed</button>
                    </form>
                    <form th:action="@{/saleorder/updateStatus}" method="post" th:if="${order.status.name()!='CANCELLED' and order.status.name()!='COMPLETED'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="saleOrderID" th:value="${order.saleOrderID}">
                        <input type="hidden" name="status" value="CANCELLED">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Cancel Order</button>
                    </form>
                </div>
                <div class="form-group mt-3">
                    <label>Total Quantity</label>
                    <input type="text" th:value="${order.totalQuantity}" readonly>
                </div>
                <div class="form-group">
                    <label>Total Amount</label>
                    <input type="text" th:value="${order.totalAmount}" readonly>
                </div>
            </div>

            <div class="form-wrapper">
                <h1>Delivery Info</h1>
                <div class="form-group">
                    <label>Planned Delivery Date</label>
                    <input type="text" th:value="${order.plannedDeliveryDate != null ? #dates.format(order.plannedDeliveryDate,'dd/MM/yyyy') : 'N/A'}" readonly>
                </div>
                <div class="form-group">
                    <label>Actual Delivery Date</label>
                    <input type="text" th:value="${order.actualDeliveryDate != null ? #dates.format(order.actualDeliveryDate,'dd/MM/yyyy HH:mm') : 'Pending'}" readonly>
                </div>
                <div class="form-group">
                    <label>Days Remaining</label>
                    <input type="text" th:value="${order.getDaysRemaining()}" readonly class="remaining-days">
                </div>
                <form th:action="@{/saleorder/delivery/update}" method="post" class="mt-2">
                    <input type="hidden" name="saleOrderID" th:value="${order.saleOrderID}" />
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="form-group">
                        <label>New Planned Date (yyyy-MM-dd)</label>
                        <input type="date" name="plannedDate" th:value="${order.plannedDeliveryDate != null ? #dates.format(order.plannedDeliveryDate,'yyyy-MM-dd') : ''}" />
                    </div>
                    <button type="submit" class="btn btn-sm btn-outline-primary">Update Delivery Date</button>
                </form>
            </div>

<!--            <div class="form-wrapper">-->
<!--                <h1>Delivery Infos</h1>-->
<!--                <form id="promotionForm" action="/discount-policy/create" method="post">-->
<!--                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>-->

<!--                    <div class="form-group">-->
<!--                        <label for="promoName">Estimated delivery date</label>-->
<!--                        <input type="text" id="promoName" name="policyName" placeholder="Enter policy name" required>-->
<!--                    </div>-->

<!--                    <div class="form-group">-->
<!--                        <label for="promoName">Actual delivery date</label>-->
<!--                        <input type="text" id="promoName" name="policyName" placeholder="Enter policy name" required>-->
<!--                    </div>-->

<!--                </form>-->
<!--            </div>-->

        </div>

        <div class="right-column">

<!--            <div class="form-wrapper">-->
<!--                <h1>Vehicle Infos</h1>-->
<!--                <form id="promotionForm2" action="/discount-policy/create" method="post">-->
<!--                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>-->

<!--                    <div class="form-group">-->
<!--                        <label for="promoName">VIN</label>-->
<!--                        <input type="text" id="promoName" name="policyName" placeholder="Enter policy name" required>-->
<!--                    </div>-->

<!--                    <div class="form-group">-->
<!--                        <label for="promoName">Quantity</label>-->
<!--                        <input type="text" id="promoName" name="policyName" placeholder="Enter policy name" required>-->
<!--                    </div>-->

<!--                    <div class="form-group">-->
<!--                        <label for="promoName">Discount applied</label>-->
<!--                        <input type="text" id="promoName" name="policyName" placeholder="Enter policy name" required>-->
<!--                    </div>-->

<!--                    <div class="form-group">-->
<!--                        <label for="promoName">Total price</label>-->
<!--                        <input type="text" id="promoName" name="policyName" placeholder="Enter policy name" required>-->
<!--                    </div>-->

<!--                </form>-->
<!--            </div>-->

            <div class="form-wrapper">

                <h1>Actions</h1>
                <form th:action="@{/saleorder/delete/{id}(id=${order.saleOrderID})}" method="post" onsubmit="return confirm('Delete this sale order?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-danger btn-sm"><i class="fas fa-trash me-1"></i>Delete Order</button>
                </form>
            </div>

            <div class="form-wrapper">
                <h1>Vehicles</h1>
                <div th:if="${order.detail != null and !order.detail.isEmpty()}">
                    <table class="table table-sm table-striped">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>VehicleID</th>
                            <th>Model</th>
                            <th>Version</th>
                            <th>Color</th>
                            <th>Discounted Unit Price (VND)</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d,stat : ${order.detail}">
                            <td th:text="${stat.index+1}"></td>
                            <td th:text="${d.vehicle != null ? d.vehicle.vehicleID : '-'}"></td>
                            <td th:text="${d.vehicle?.version?.model?.modelName ?: '-'}"></td>
                            <td th:text="${d.vehicle?.version?.versionName ?: '-'}"></td>
                            <td th:text="${d.vehicle?.color?.colorName ?: '-'}"></td>
                            <td th:text="${#numbers.formatDecimal(d.price,0,'COMMA',0,'POINT') + ' VND'}"></td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="mt-2 small text-muted" th:if="${order.quotation != null}">
                        Base Discount Applied: <span th:text="${order.quotation.discountPercent != null ? order.quotation.discountPercent + '%' : '0%'}"></span>
                    </div>
                </div>
                <div th:if="${order.detail == null or order.detail.isEmpty()}">
                    <p class="text-muted">No vehicle details.</p>
                </div>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>

</body>

</html>
