<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Customer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        .breadcrumb {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .breadcrumb-item {
            font-size: 14px;
            font-weight: 500;
        }

        .breadcrumb-item a {
            color: #6c757d;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .breadcrumb-item a:hover {
            color: #007bff;
        }

        .breadcrumb-item.active {
            color: #495057;
            font-weight: 600;
        }

        .breadcrumb-item + .breadcrumb-item::before {
            content: "›";
            color: #adb5bd;
            font-weight: bold;
            margin: 0 8px;
        }
    </style>
</head>

<body class="bg-gradient2-custom">

<button class="mobile-menu-toggle" id="menuToggleBtn">
    <i class="fa-solid fa-bars"></i>
</button>

<div class="d-flex">

    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContent flex-grow-1 p-3" style="overflow: hidden">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="/showDealerHomePage" class="d-flex align-items-center">
                        <i class="fas fa-home me-1"></i>
                        Home
                    </a>
                </li>
                <li class="breadcrumb-item">
                    <a href="/dealerCustomerManagement">Customer Management</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                    Create Customer
                </li>
            </ol>
        </nav>


        <div class="d-flex">
            <h2>Create a New Customer</h2>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <strong th:text="${errorMessage}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="create-vehicle-form-container">

            <!-- ✅ Bind to CustomerForm -->
            <form action="/customer/save" method="post" th:object="${customerForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="returnUrl" th:value="${returnUrl}" />
                
                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger mb-3">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <strong>Please fix the following errors:</strong>
                    <ul class="mb-0 mt-2">
                        <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                    </ul>
                </div>

                <div class="create-vehicle-form-row">
                    <label>Full Name</label>
                    <input th:field="*{fullName}" type="text" class="create-vehicle-form-input mb-1" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="create-vehicle-form-row">
                    <label>Email</label>
                    <input th:field="*{email}" type="email" class="create-vehicle-form-input mb-1" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="create-vehicle-form-row">
                    <label>Phone Number</label>
                    <input th:field="*{phone}" type="text" class="create-vehicle-form-input mb-1" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <div class="create-vehicle-form-row">
                    <label>Address</label>
                    <input th:field="*{address}" type="text" class="create-vehicle-form-input mb-1" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>

                <div class="create-vehicle-form-row">
                    <label>Birth Date</label>
                    <input th:field="*{birthDate}" type="date" class="create-vehicle-form-input mb-1" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
                </div>

                <div class="create-vehicle-form-row">
                    <label>Note</label>
                    <input th:field="*{note}" type="text" class="create-vehicle-form-input mb-1">
                    <div class="text-danger small" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></div>
                </div>

                <div class="create-vehicle-form-row">
                    <label>Test Drive Schedule</label>
                    <input th:field="*{testDriveSchedule}" name="testDriveSchedule" type="datetime-local" class="create-vehicle-form-input mb-1">
                    <div class="text-danger small" th:if="${#fields.hasErrors('testDriveSchedule')}" th:errors="*{testDriveSchedule}"></div>
                </div>

                <div class="create-vehicle-form-row">
                    <label>Vehicle of Interest</label>
                    <input th:field="*{vehicleInterest}" type="text" class="create-vehicle-form-input mb-1">
                    <div class="text-danger small" th:if="${#fields.hasErrors('vehicleInterest')}" th:errors="*{vehicleInterest}"></div>
                </div>

                <div class="create-vehicle-form-row">
                    <label></label>
                    <button type="submit" class="btn btn-dark rounded-pill" style="margin-bottom: 20px">Create</button>
                </div>
            </form>

            <div th:if="${error}" class="alert alert-danger mt-3" role="alert">
                <span th:text="${error}"></span>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>

</body>
</html>
