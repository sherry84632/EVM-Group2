<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer Level Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
    <style>
        body { background:#f5f6f8; min-height:100vh; font-family: system-ui, sans-serif; }
        .level-container { max-width:1000px; margin:0 auto; background:#fff; padding:24px; border:1px solid #e0e0e0; border-radius:8px; }
        .level-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding-bottom:12px; border-bottom:1px solid #e5e7eb; }
        .level-header h1 { font-size:24px; margin:0; font-weight:600; color:#333; }
        .nav-shortcut a { text-decoration:none; color:#0d6efd; font-weight:500; padding:6px 12px; border:1px solid #0d6efd; border-radius:6px; display:inline-block; font-size:14px; }
        .nav-shortcut a + a { margin-left:8px; }
        .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:20px; }
        .stat-card { background:#fafafa; border:1px solid #e5e5e5; border-radius:6px; padding:16px; }
        .stat-card h3 { font-size:12px; font-weight:600; text-transform:uppercase; margin:0 0 8px; color:#555; }
        .stat-value { font-size:26px; font-weight:700; color:#222; line-height:1.2; }
        .stat-sub { font-size:12px; color:#666; margin-top:4px; }
        .progress-wrap { margin:20px 0; background:#fafafa; padding:16px; border:1px solid #e5e5e5; border-radius:6px; }
        .progress-label { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; font-weight:600; color:#333; }
        .progress-bar { height:14px; background:#e5e5e5; border-radius:7px; overflow:hidden; }
        .progress-bar > div { height:100%; background:#198754; width:0; }
        .next-goal { background:#eef9f3; border:1px solid #cde7d9; padding:14px 16px; border-radius:6px; font-size:14px; line-height:1.4; margin-bottom:20px; }
        .next-goal strong { color:#0f5132; }
        .section-title { font-size:18px; font-weight:600; color:#333; margin:24px 0 12px; padding-bottom:6px; border-bottom:1px solid #e5e7eb; }
        .tier-table { width:100%; border-collapse:collapse; margin-top:8px; font-size:14px; }
        .tier-table th, .tier-table td { padding:10px 12px; border:1px solid #e5e5e5; }
        .tier-table th { background:#f0f0f0; font-weight:600; text-transform:uppercase; font-size:11px; color:#444; }
        .current-tier-row { background:#e8f1ff; font-weight:600; }
        .badge { /* removed usage */ display:none; }
        .badge-bronze,.badge-silver,.badge-gold,.badge-platinum { display:none; }
        .alert { padding:12px 14px; border-radius:4px; margin-bottom:16px; font-size:14px; }
        .alert-danger { background:#f8d7da; border:1px solid #f5c2c7; color:#842029; }
        @media (max-width:768px){ .level-header { flex-direction:column; align-items:flex-start; gap:12px; } }
    </style>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>
    <div class="mainContent flex-grow-1 p-3" style="overflow-y:auto; height:100vh;">
        <div class="level-container">
            <div class="level-header">
                <h1>Dealer Level Dashboard</h1>
                <div class="nav-shortcut" style="display:flex; gap:10px; flex-wrap:wrap;">
                    <a href="/showDealerHomePage">← Dealer Home</a>
                    <a href="/saleorder">Sale Orders</a>
                </div>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="stat-grid" th:unless="${error}">
                <div class="stat-card">
                    <h3>Current Level</h3>
                    <div class="stat-value" th:text="${dbLevelName}"></div>
                    <div class="stat-sub">
                        <span th:if="${currentTierName != dbLevelName}" th:text="'Normalized: ' + ${currentTierName}"></span>
                    </div>
                </div>
                <div class="stat-card">
                    <h3>Total Vehicles Sold</h3>
                    <div class="stat-value" th:text="${soldQty}"></div>
                    <div class="stat-sub">Based on completed sale orders</div>
                </div>
                <div class="stat-card">
                    <h3>Next Target Tier</h3>
                    <div class="stat-value" th:text="${nextTierName != null ? nextTierName : '—'}"></div>
                    <div class="stat-sub" th:text="${nextThreshold != null ? ('Target: ' + nextThreshold + ' vehicles') : 'Reached top tier'}"></div>
                </div>
                <div class="stat-card">
                    <h3>Remaining</h3>
                    <div class="stat-value" th:text="${nextThreshold != null ? remainingToNext : 0}"></div>
                    <div class="stat-sub" th:if="${nextThreshold != null}" th:text="${remainingToNext} + ' more to reach ' + ${nextTierName}"></div>
                    <div class="stat-sub" th:if="${nextThreshold == null}">You are at the highest tier</div>
                </div>
            </div>

            <div class="progress-wrap" th:if="${nextThreshold != null}">
                <div class="progress-label">
                    <span th:text="'Progress to ' + ${nextTierName}"></span>
                    <span th:text="${#numbers.formatDecimal(progressPercent,1,'COMMA',1,'POINT')} + '%' "></span>
                </div>
                <div class="progress-bar">
                    <div th:style="'width:' + ${progressPercent} + '%'" ></div>
                </div>
            </div>

            <div class="next-goal" th:if="${nextThreshold != null}">
                <strong th:text="${remainingToNext > 0 ? ('' + remainingToNext + ' remaining') : 'Almost there!'}"></strong>
                <span th:text="${remainingToNext > 0 ? (' to reach ' + nextTierName) : (' Just a few more sales to confirm ' + nextTierName)}"></span>
            </div>

            <h2 class="section-title">Tier List</h2>
            <table class="tier-table">
                <thead>
                <tr>
                    <th>Tier</th>
                    <th>Level ID</th>
                    <th>Discount Share (%)</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="lvl : ${levels}" th:class="${lvl.levelName == currentTierName} ? 'current-tier-row' : ''">
                    <td><span th:text="${lvl.levelName}"></span></td>
                    <td th:text="${lvl.levelID}"></td>
                    <td th:text="${lvl.discountSharePercent != null ? lvl.discountSharePercent : 0}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script th:inline="javascript">
    const pct = /*[[${progressPercent}]]*/ 0;
    const bar = document.querySelector('.progress-bar > div');
    if (bar) { bar.style.width = (pct>100?100:pct) + '%'; }
</script>
</body>
</html>
