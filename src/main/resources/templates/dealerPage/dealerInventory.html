<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer Inventory</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="/css/inentoryScrollBox.css">
    <link rel="stylesheet" href="/css/dealerVehicleQuotation.css" />
</head>

<body class="bg-gradient2-custom" style="overflow: hidden">

<button class="mobile-menu-toggle" id="menuToggleBtn">
    <i class="fa-solid fa-bars"></i>
</button>

<div class="d-flex">

    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContent flex-grow-1 p-3 dealer-vehicle-page-wrapper" style="overflow: hidden">

        <!-- Breadcrumb Navigation -->
        <nav aria-label="breadcrumb" class="mb-2">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/showDealerHomePage"><i class="fa-solid fa-home me-1"></i>Home</a>
                </li>
                <li class="breadcrumb-item"><a href="/dealerVehiclesInformation"><i class="fa-solid fa-car-side me-1"></i>Vehicles</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page"><i class="fa-solid fa-warehouse me-1"></i>Inventory
                </li>
            </ol>
        </nav>

        <!-- Filter Toolbar -->
        <div class="dv-toolbar mb-3">
            <form action="/dealer-inventory" method="get" class="row g-2 align-items-end w-100">
                <div class="col-auto">
                    <label class="form-label">VIN</label>
                    <input name="vin" type="text" class="form-control form-control-sm" placeholder="VIN" th:value="${vin}">
                </div>
                <div class="col-auto">
                    <label class="form-label">Model</label>
                    <select name="modelId" class="form-select form-select-sm" id="modelSelect">
                        <option th:selected="${modelId==null}" value="">All</option>
                        <option th:each="m : ${models}" th:value="${m.modelID}" th:text="${m.modelName}" th:selected="${modelId==m.modelID}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="form-label">Version</label>
                    <select name="versionId" class="form-select form-select-sm" id="versionSelect">
                        <option th:selected="${versionId==null}" value="">All</option>
                        <option th:each="v : ${versions}" th:value="${v.versionID}" th:text="${v.versionName}" th:selected="${versionId==v.versionID}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="form-label">Color</label>
                    <select name="colorId" class="form-select form-select-sm" id="colorSelect">
                        <option th:selected="${colorId==null}" value="">All</option>
                        <option th:each="c : ${colors}" th:value="${c.colorID}" th:text="${c.colorName}" th:selected="${colorId==c.colorID}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select form-select-sm">
                        <option value="">All</option>
                        <option value="AVAILABLE" th:selected="${status=='AVAILABLE'}">IN_STOCK</option>
                        <option value="RESERVED" th:selected="${status=='RESERVED'}">RESERVED</option>
                        <option value="SOLD" th:selected="${status=='SOLD'}">SOLD</option>
                        <option value="TRANSFERRED" th:selected="${status=='TRANSFERRED'}">TRANSFERRED</option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="form-label">Received From</label>
                    <input name="from" type="date" class="form-control form-control-sm" th:value="${from}">
                </div>
                <div class="col-auto">
                    <label class="form-label">To</label>
                    <input name="to" type="date" class="form-control form-control-sm" th:value="${to}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-dark btn-sm">
                        <i class="fas fa-filter me-1"></i>Filter
                    </button>
                </div>
            </form>
        </div>

        <!-- Vehicle Grid -->
        <div style="overflow-y: auto; overflow-x: hidden; width: 100%; height: 85vh">

            <div class="dv-grid" id="vehicleGrid" th:if="${vehicles != null and !vehicles.isEmpty()}">

                <div th:each="inv : ${vehicles}" class="dv-card">
                    <!-- VIN -->
                    <div class="dv-model-name">
                        <i class="fas fa-barcode text-primary"></i>
                        <span th:text="${inv.vin}">VIN</span>
                    </div>

                    <div class="dv-meta">
                        <!-- Status -->
                        <div class="dv-meta-row">
                            <span class="dv-label">Status</span>
                            <span th:text="${inv.status=='AVAILABLE' ? 'IN_STOCK' : inv.status}"
                                  th:class="${inv.status=='AVAILABLE' ? 'badge bg-success' : (inv.status=='RESERVED' ? 'badge bg-warning text-dark' : (inv.status=='SOLD' ? 'badge bg-secondary' : 'badge bg-info'))}"></span>
                        </div>

                        <!-- Model -->
                        <div class="dv-meta-row">
                            <span class="dv-label">Model</span>
                            <span class="dv-value">
                                <span class="dv-badge" th:text="${inv.vehicle != null && inv.vehicle.modelName != null ? inv.vehicle.modelName : 'N/A'}"></span>
                            </span>
                        </div>

                        <!-- Version -->
                        <div class="dv-meta-row">
                            <span class="dv-label">Version</span>
                            <span class="dv-value">
                                <span class="dv-badge" th:text="${inv.vehicle != null && inv.vehicle.versionName != null ? inv.vehicle.versionName : 'N/A'}"></span>
                            </span>
                        </div>

                        <!-- Color -->
                        <div class="dv-meta-row">
                            <span class="dv-label">Color</span>
                            <span class="dv-value">
                                <span class="dv-badge" th:text="${inv.vehicle != null && inv.vehicle.colorName != null ? inv.vehicle.colorName : 'N/A'}"></span>
                            </span>
                        </div>

                        <!-- Received Date -->
                        <div class="dv-meta-row">
                            <span class="dv-label">Received</span>
                            <span class="dv-value">
                                <span class="dv-year-tag" th:text="${#dates.format(inv.receivedDate,'dd/MM/yyyy')}"></span>
                            </span>
                        </div>

                        <!-- Cost Price -->
                        <div class="dv-meta-row" th:if="${inv.costPrice != null}">
                            <span class="dv-label">Cost Price</span>
                            <span class="dv-value">
                                <span class="dv-price-tag" th:text="'$' + ${#numbers.formatDecimal(inv.costPrice, 0, 'COMMA', 0, 'POINT')}"></span>
                            </span>
                        </div>

                        <!-- Vehicle Image -->
                        <div class="vehicle-image-container mt-3">
                            <a th:if="${inv.vehicle != null && inv.vehicle.vehicleID != null}"
                               th:href="@{/evm/vehicle/detail/{id}(id=${inv.vehicle.vehicleID})}"
                               target="_blank"
                               style="display: block; cursor: pointer;">
                                <img th:if="${inv.vehicle.version != null and inv.vehicle.version.model != null and inv.vehicle.version.model.modelID != null}"
                                     th:src="@{/evm/vehicle/modelImage/{modelId}(modelId=${inv.vehicle.version.model.modelID})}"
                                     alt="Model Image"
                                     class="vehicle-image-bbg"
                                     style="cursor: pointer; transition: transform 0.3s ease;"
                                     onmouseover="this.style.transform='scale(1.05)'"
                                     onmouseout="this.style.transform='scale(1)'" />
                            </a>
                        </div>

                        <!-- Actions -->
                        <div class="mt-3">
                            <a class="btn btn-sm btn-outline-primary w-100"
                               th:href="@{'/dealer-inventory/view'(vin=${inv.vin})}">
                                <i class="fas fa-eye me-1"></i>View Details
                            </a>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Empty State -->
            <div th:if="${vehicles == null or vehicles.isEmpty()}" class="dv-empty">
                <h4><i class="fas fa-inbox me-2"></i>No Vehicles in Inventory</h4>
                <p>No vehicles found matching the selected filters.</p>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const modelSelect = document.getElementById('modelSelect');
  const versionSelect = document.getElementById('versionSelect');
  const colorSelect = document.getElementById('colorSelect');

  function clearOptions(sel){
    while(sel.options.length > 1){ sel.remove(1); }
  }

  async function fetchJSON(url){
    const res = await fetch(url, { headers: { 'Accept':'application/json' }});
    if(!res.ok) return [];
    return await res.json();
  }

  modelSelect && modelSelect.addEventListener('change', async () => {
    const modelId = modelSelect.value;
    clearOptions(versionSelect); clearOptions(colorSelect);
    if(modelId){
      const versions = await fetchJSON(`/dealer-inventory/versions?modelId=${modelId}`);
      versions.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.versionID; opt.textContent = v.versionName; versionSelect.appendChild(opt);
      });
    }
  });

  versionSelect && versionSelect.addEventListener('change', async () => {
    const modelId = modelSelect.value || '';
    const versionId = versionSelect.value || '';
    clearOptions(colorSelect);
    if(modelId || versionId){
      const url = `/dealer-inventory/colors?${modelId?`modelId=${modelId}`:''}${versionId?`${modelId?'&':''}versionId=${versionId}`:''}`;
      const colors = await fetchJSON(url);
      colors.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.colorID; opt.textContent = c.colorName; colorSelect.appendChild(opt);
      });
    }
  });
});
</script>

</body>

</html>
