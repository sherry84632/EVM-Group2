<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Lỗi hệ thống</title>
    <link rel="stylesheet" href="/css/mainPageStyle.css" />
    <link rel="stylesheet" href="/css/iconStyle.css" />
    <style>
        body { background:#f1f5f9; font-family: 'Segoe UI', Arial, sans-serif; }
        .error-wrapper { max-width: 800px; margin:60px auto; background:#fff; padding:32px 40px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.08); }
        h1 { margin:0 0 12px; font-size:30px; font-weight:700; color:#dc2626; display:flex; align-items:center; gap:10px; }
        h1 span.icon { font-size:38px; }
        .msg-primary { font-size:16px; color:#334155; line-height:1.5; margin-bottom:20px; }
        .stack-box { background:#0f172a; color:#e2e8f0; padding:16px 18px; border-radius:10px; font-size:13px; line-height:1.4; max-height:280px; overflow:auto; }
        .stack-box code { font-family:Consolas, monospace; white-space:pre-wrap; }
        .actions { margin-top:24px; display:flex; gap:14px; flex-wrap:wrap; }
        .actions a { text-decoration:none; padding:12px 20px; border-radius:8px; font-weight:600; font-size:14px; transition:.25s; }
        .btn-home { background:#6366f1; color:#fff; }
        .btn-home:hover { background:#4f46e5; }
        .btn-back { background:#f1f5f9; color:#334155; border:1px solid #cbd5e1; }
        .btn-back:hover { background:#e2e8f0; }
        .context { font-size:13px; color:#64748b; margin-top:18px; }
        .badge { display:inline-block; padding:4px 10px; background:#fee2e2; color:#b91c1c; border-radius:20px; font-size:12px; font-weight:600; }
    </style>
</head>
<body>
<div class="error-wrapper">
    <h1><span class="icon">⚠️</span>Lỗi phát sinh</h1>
    <div th:if="${error}" class="msg-primary" th:text="${error}"></div>
    <div th:if="${message}" class="msg-primary" th:text="${message}"></div>
    <div th:unless="${error}" class="msg-primary">Đã xảy ra sự cố không xác định. Vui lòng thử lại hoặc liên hệ quản trị viên.</div>

    <div th:if="${stackTrace}" class="stack-box">
        <code th:text="${stackTrace}"></code>
    </div>

    <div class="context" th:if="${timestamp}" th:text="'Thời điểm: ' + ${timestamp}"></div>
    <div class="context" th:if="${path}" th:text="'URL: ' + ${path}"></div>

    <div class="actions">
        <a href="/quotation/list" class="btn-back">Quay về báo giá</a>
        <a href="/" class="btn-home">Trang chủ</a>
    </div>

    <div class="context" style="margin-top:28px;">
        <span class="badge" th:if="${error}">ERROR</span>
        <span style="margin-left:8px; font-size:12px; color:#94a3b8;">Nếu lỗi tiếp tục xảy ra, gửi ảnh màn hình cho bộ phận hỗ trợ.</span>
    </div>
</div>
</body>
</html>
