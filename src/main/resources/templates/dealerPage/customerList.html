<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>

<body class="bg-gradient2-custom" style="overflow: hidden;">

<button class="mobile-menu-toggle" id="menuToggleBtn">
    <i class="fa-solid fa-bars"></i>
</button>

<div class="d-flex">

    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContent flex-grow-1 p-3" style="overflow: hidden">

        <!-- Success/Error Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex wrap justify-content-between align-items-center mb-3">

            <h1><i class="fas fa-users me-2"></i>Customer List</h1>

            <div class="d-flex gap-2">
                <form action="/customer/search" method="get" class="d-flex gap-2">
                    <input name="keyword"
                           type="text"
                           class="form-control"
                           placeholder="Search by customer name"
                           th:value="${keyword}"
                           style="min-width: 250px;">
                    <button type="submit" class="btn btn-dark">
                        <i class="fas fa-search me-1"></i>Search
                    </button>
                </form>
                <a href="/customer/create" class="btn btn-success">
                    <i class="fas fa-user-plus me-1"></i>New Customer
                </a>
            </div>

        </div>

        <div class="scroll-box">

            <!-- No customers message -->
            <div th:if="${customers == null or #lists.isEmpty(customers)}" class="text-center py-5">
                <i class="fas fa-users fa-3x text-muted mb-3"></i>
                <h4 class="text-muted">No Customers Found</h4>
                <p class="text-muted" th:if="${keyword != null and !keyword.isEmpty()}">
                    No customers found matching "<span th:text="${keyword}"></span>"
                </p>
                <p class="text-muted" th:if="${keyword == null or keyword.isEmpty()}">
                    Create your first customer to get started.
                </p>
                <a href="/customer/create" class="btn btn-primary">
                    <i class="fas fa-user-plus me-2"></i>Create New Customer
                </a>
            </div>

            <!-- Customer cards -->
            <div th:if="${customers != null and !#lists.isEmpty(customers)}">
                <div th:each="customer : ${customers}" class="d-flex" style="justify-content: center; align-items: center; padding: 35px;">
                    <a th:href="@{/customer/detail/{id}(id=${customer.customerID})}" style="text-decoration: none">
                        <button class="button_customer_list">
                            <i class="fa-solid fa-user"></i>
                            <span>
                                <h4 th:text="${customer.fullName}">Customer Name</h4>
                                <p><i class="fas fa-envelope me-1"></i><span th:text="${customer.email}">email@example.com</span></p>
                                <p><i class="fas fa-phone me-1"></i><span th:text="${customer.phone}">Phone</span></p>
                                <p th:if="${customer.birthDate != null}">
                                    <i class="fas fa-birthday-cake me-1"></i>
                                    <span th:text="${#dates.format(customer.birthDate, 'dd/MM/yyyy')}">Birth Date</span>
                                </p>
                             </span>
                        </button>
                    </a>
                </div>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>

</body>

</html>
