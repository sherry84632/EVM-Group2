<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="/css/inentoryScrollBox.css">
    <link rel="stylesheet" href="/css/dealerVehicleQuotation.css" />
</head>

<body class="bg-gradient2-custom" style="overflow: hidden;">

<button class="mobile-menu-toggle" id="menuToggleBtn">
    <i class="fa-solid fa-bars"></i>
</button>

<div class="d-flex">

    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContent flex-grow-1 p-3 dealer-vehicle-page-wrapper" style="overflow: hidden">

        <form method="post" id="bulkAddForm" class="dv-toolbar" th:action="@{/quotation/addVehiclesWithQty}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="flex-grow-1">
                <label class="form-label">Customer</label>
                <select name="customerID" class="form-select form-select-sm" required>
                    <option value="">-- Choose Customer --</option>
                    <option th:each="c : ${customerList}" th:value="${c.customerID}" th:text="${c.fullName + ' (' + c.phone + ')'}"></option>
                </select>
            </div>
            <div class="text-end">
                <button type="submit" class="dv-btn-primary">
                    <i class="fas fa-file-invoice-dollar"></i><span>Add Selected with Quantities</span>
                </button>
            </div>
            <div class="w-100 d-flex justify-content-between mt-2">
                <div id="selectedCount" class="dv-selected-counter">0 vehicle selected.</div>
                <div id="vehicleDynamicInputs"></div>
            </div>
        </form>

        <div style="overflow-y: auto; overflow-x: hidden; width: 100%; height: 80vh">

            <div class="dv-grid" id="vehicleGrid" th:if="${vehicleList != null and !vehicleList.isEmpty()}">

                <div th:each="vehicle : ${vehicleList}" class="dv-card">
                    <div class="dv-checkbox-wrapper">
                        <input type="checkbox" class="form-check-input vehicle-select-checkbox" th:data-vid="${vehicle.vehicleID}" />
                    </div>
                    <div class="dv-model-name">
                        <i class="fas fa-car-side text-primary"></i>
                        <span th:text="${vehicle.modelName}"></span>
                    </div>
                    <div class="dv-meta">
                        <div class="dv-meta-row">
                            <span class="dv-label">Version</span>
                            <span class="dv-value"> <span class="dv-badge" th:text="${vehicle.version != null ? vehicle.version.versionName : 'Version'}"></span> </span>
                        </div>
                        <div class="dv-meta-row">
                            <span class="dv-label">Year</span>
                            <span class="dv-value"><span class="dv-year-tag" th:text="${vehicle.manufactureYear}"></span></span>
                        </div>
                        <div class="dv-meta-row">
                            <span class="dv-label">Base Price</span>
                            <span class="dv-value"><span class="dv-price-tag" th:text="${vehicle.basePrice}"></span></span>
                        </div>
                        <div class="dv-meta-row" th:if="${vehicle.color != null}">
                            <span class="dv-label">Color</span>
                            <span class="dv-value"><span class="dv-badge" th:text="${vehicle.color.colorName}"></span></span>
                        </div>
                        <div class="dv-meta-row">
                            <span class="dv-label">Quantity</span>
                            <input type="number" min="1" value="1" class="form-control form-control-sm per-vehicle-qty" th:data-vid="${vehicle.vehicleID}" />
                        </div>
                        <div class="vehicle-image-container">
                            <a th:if="${vehicle.vehicleID != null}"
                               th:href="@{/evm/vehicle/detail/{id}(id=${vehicle.vehicleID})}"
                               target="_blank"
                               style="display: block; cursor: pointer;">
                                <img th:if="${vehicle.version != null and vehicle.version.model != null and vehicle.version.model.modelID != null}"
                                     th:src="@{/evm/vehicle/modelImage/{modelId}(modelId=${vehicle.version.model.modelID})}"
                                     alt="Model Image"
                                     class="vehicle-image-bbg"
                                     style="cursor: pointer; transition: transform 0.3s ease;"
                                     onmouseover="this.style.transform='scale(1.05)'"
                                     onmouseout="this.style.transform='scale(1)'"
                                     onload="this.nextElementSibling?.style.display='none';"
                                     onerror="this.style.display='none'; this.nextElementSibling?.style.display='block';"/>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
            <div th:if="${vehicleList == null or vehicleList.isEmpty()}" class="dv-empty">
                <h4><i class="fas fa-car-side me-2"></i>No vehicles found</h4>
                <p>Try creating a new vehicle.</p>
                <a href="/evmCreateANewVehicleToList" class="dv-btn-primary" style="text-decoration:none; display:inline-flex;">
                    <i class="fas fa-plus"></i>Create Vehicle
                </a>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>
<script>
(function(){
  const selectedCountEl = document.getElementById('selectedCount');
  const hiddenContainer = document.getElementById('vehicleDynamicInputs');
  function rebuildHiddenFields(){
    hiddenContainer.innerHTML='';
    const selected = document.querySelectorAll('.vehicle-select-checkbox:checked');
    selected.forEach(ch=>{
      const vid = ch.getAttribute('data-vid');
      const qtyInput = document.querySelector('.per-vehicle-qty[data-vid="'+vid+'"]');
      const qty = qtyInput && qtyInput.value>0 ? qtyInput.value : 1;
      const hVid = document.createElement('input'); hVid.type='hidden'; hVid.name='vehicleIds'; hVid.value=vid; hiddenContainer.appendChild(hVid);
      const hQty = document.createElement('input'); hQty.type='hidden'; hQty.name='quantities'; hQty.value=qty; hiddenContainer.appendChild(hQty);
    });
    selectedCountEl.textContent = selected.length + ' vehicle' + (selected.length!==1?'s':'') + ' selected.';
    document.querySelectorAll('.dv-card').forEach(card=>card.classList.remove('selected'));
    selected.forEach(ch=>{ const card = ch.closest('.dv-card'); if(card) card.classList.add('selected'); });
  }
  // Rebuild whenever checkbox or quantity changes
  document.addEventListener('change', e=>{
    if(e.target.classList.contains('vehicle-select-checkbox') || e.target.classList.contains('per-vehicle-qty')){
      rebuildHiddenFields();
    }
  });
  // Validate before submit
  document.getElementById('bulkAddForm').addEventListener('submit', function(ev){
    const customer = this.querySelector('select[name="customerID"]');
    const anySelected = document.querySelector('.vehicle-select-checkbox:checked');
    if(!customer.value){ alert('Please choose a customer.'); ev.preventDefault(); return; }
    if(!anySelected){ alert('Please select at least one vehicle.'); ev.preventDefault(); return; }
    // Ensure hidden fields reflect latest quantities
    rebuildHiddenFields();
  });
})();
</script>

</body>

</html>
