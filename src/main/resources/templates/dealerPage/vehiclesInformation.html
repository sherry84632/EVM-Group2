<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Information</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>

    <div class="mainContent flex-grow-1 p-4">

        <!-- Icon buttons matching DealerHomePage style -->
        <div class="d-flex wrap justify-content-center mt-5">
            <div class="d-flex" style="justify-content: center; align-items: center; padding: 35px;">
                <a href="/evm/vehicle/list" style="text-decoration: none;">
                    <button class="icon-btn">
                        <i class="fa-solid fa-car-side"></i>
                        <span>
                            View Vehicle Catalog
                        </span>
                    </button>
                </a>
            </div>

            <div class="d-flex" style="justify-content: center; align-items: center; padding: 35px;">
                <a href="/orderdealer" style="text-decoration: none;">
                    <button class="icon-btn">
                        <i class="fa-solid fa-clipboard-list"></i>
                        <span>
                            Order Status
                        </span>
                    </button>
                </a>
            </div>

            <div class="d-flex" style="justify-content: center; align-items: center; padding: 35px;">
                <a href="/orderdealer/history" style="text-decoration: none;">
                    <button class="icon-btn">
                        <i class="fa-solid fa-history"></i>
                        <span>
                            Order History
                        </span>
                    </button>
                </a>
            </div>

            <div class="d-flex" style="justify-content: center; align-items: center; padding: 35px;">
                <a href="/dealer-inventory" style="text-decoration: none;">
                    <button class="icon-btn">
                        <i class="fa-solid fa-warehouse"></i>
                        <span>
                            Inventory
                        </span>
                    </button>
                </a>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
