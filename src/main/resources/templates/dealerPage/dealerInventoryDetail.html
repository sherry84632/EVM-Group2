<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="/css/breadScrumbNav.css">
    <style>
        .breadcrumb-item a:hover {
            color: #007bff;
        }
    </style>
</head>
<body class="bg-gradient2-custom">
<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>
    <div class="mainContent flex-grow-1 p-3">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="/showDealerHomePage" class="d-flex align-items-center">
                        <i class="fas fa-home me-1"></i>
                        Home
                    </a>
                </li>
                <li class="breadcrumb-item">
                    <a href="/dealerVehiclesInformation">Vehicle Management</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="/dealer-inventory">Inventory</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                    <i class="fas fa-list me-1"></i>
                    Detail
                </li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Vehicle Detail</h3>
            <a class="btn btn-outline-secondary btn-sm" href="/dealer-inventory">Back</a>
        </div>

        <div class="row g-3">
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span class="fw-semibold">VIN: <span th:text="${detail.vin}"></span></span>
                        <span th:text="${detail.status=='AVAILABLE' ? 'IN_STOCK' : detail.status}"
                              th:class="${detail.status=='AVAILABLE' ? 'badge bg-primary' : (detail.status=='RESERVED' ? 'badge bg-warning text-dark' : (detail.status=='SOLD' ? 'badge bg-success' : 'badge bg-secondary'))}"></span>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-6 mb-2">
                                <small class="text-muted d-block">Model</small>
                                <span th:text="${detail.modelName}">Model</span>
                            </div>
                            <div class="col-6 mb-2">
                                <small class="text-muted d-block">Version</small>
                                <span th:text="${detail.versionName}">Version</span>
                            </div>
                            <div class="col-6 mb-2">
                                <small class="text-muted d-block">Color</small>
                                <span th:text="${detail.colorName}">Color</span>
                            </div>
                            <div class="col-6 mb-2">
                                <small class="text-muted d-block">Engine</small>
                                <span th:text="${detail.engine}">Engine</span>
                            </div>
                            <div class="col-6 mb-2">
                                <small class="text-muted d-block">Received Date</small>
                                <span th:text="${#dates.format(detail.receivedDate,'yyyy-MM-dd')}">Date</span>
                            </div>
                            <div class="col-6 mb-2">
                                <small class="text-muted d-block">Price</small>
                                <span th:text="${#numbers.formatDecimal(detail.basePrice, 0, 'POINT', 0, 'COMMA')}">0</span>
                            </div>
                            <div class="col-6 mb-2" th:if="${detail.purchaseOrderId != null}">
                                <small class="text-muted d-block">Purchase Order ID</small>
                                <a th:href="@{'/evm/orders/detail/' + ${detail.purchaseOrderId}}" th:text="${detail.purchaseOrderId}">PO</a>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-white d-flex gap-2">
                        <a class="btn btn-sm btn-outline-primary" th:if="${detail.purchaseOrderId != null}"
                           th:href="@{'/evm/orders/detail/' + ${detail.purchaseOrderId}}">View Purchase Order</a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header">Model Thumbnail</div>
                    <div class="card-body d-flex align-items-center justify-content-center">
                        <img src="/images/productIcon.png" alt="thumbnail" class="img-fluid" style="max-height: 180px;"/>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
