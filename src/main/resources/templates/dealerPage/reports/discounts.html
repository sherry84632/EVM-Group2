<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Dealer Discount Policy Report</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>.stat-card{min-height:96px}</style>
    <script>
        function qs(id){return document.getElementById(id);} async function fetchJson(u){const r=await fetch(u,{credentials:'include'});return await r.json();}
        function formatCurrency(value){if(!value)return '$0';const num=typeof value==='string'?parseFloat(value):value;return '$'+Math.round(num).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});}
        function buildParams(){const from=qs('from').value;const to=qs('to').value;const p=new URLSearchParams();if(from)p.append('from',from);if(to)p.append('to',to);return p.toString();}
        let bar;
        async function loadData(){
            const p=buildParams();
            const s=await fetchJson(`/dealer/reports/discounts/summary?${p}`);
            qs('kApplied').innerText=s.appliedCount||0;
            const byPolicy=s.byPolicy||[];
            const labels=byPolicy.map(r=>r.policyName||'N/A');
            const revenue=byPolicy.map(r=>r.revenue||0);
            if(bar) bar.destroy(); bar=new Chart(qs('byPolicy'),{type:'bar',data:{labels,datasets:[{label:'Revenue',data:revenue,backgroundColor:'rgba(255,159,64,0.6)'}]},options:{scales:{y:{beginAtZero:true}}}});
            const tbody=qs('tbl'); tbody.innerHTML='';
            byPolicy.forEach(r=>{const tr=document.createElement('tr'); tr.innerHTML=`<td>${r.policyName||''}</td><td class="text-end">${r.orders||0}</td><td class="text-end">${formatCurrency(r.revenue||0)}</td>`; tbody.appendChild(tr);});
        }
        window.addEventListener('DOMContentLoaded',()=>{qs('apply').addEventListener('click',loadData);loadData();});
    </script>
</head>
<body class="bg-gradient2-custom">
<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>
    <div class="mainContent flex-grow-1 p-3">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/showDealerHomePage"><i class="fa-solid fa-home me-1"></i>Home</a></li>
                <li class="breadcrumb-item"><a href="/dealer/reports"><i class="fa-solid fa-chart-line me-1"></i>Reports</a></li>
                <li class="breadcrumb-item active" aria-current="page"><i class="fa-solid fa-tags me-1"></i>Discount Policy Report</li>
            </ol>
        </nav>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Discount Policy Effectiveness</h3>
        </div>

        <form class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="row g-2 align-items-end">
                    <div class="col-6 col-md-3">
                        <label class="form-label">From</label>
                        <input type="date" id="from" class="form-control" />
                    </div>
                    <div class="col-6 col-md-3">
                        <label class="form-label">To</label>
                        <input type="date" id="to" class="form-control" />
                    </div>
                    <div class="col-12 col-md-3 d-grid">
                        <button type="button" id="apply" class="btn btn-primary">Apply</button>
                    </div>
                </div>
            </div>
        </form>

        <div class="row g-3 mb-3">
            <div class="col-12 col-sm-6 col-xl-3"><div class="card shadow-sm stat-card"><div class="card-body"><div class="text-muted small">Orders with Discount</div><div class="fs-3 fw-semibold" id="kApplied">0</div></div></div></div>
        </div>

        <div class="row g-3">
            <div class="col-12 col-xl-6">
                <div class="card shadow-sm h-100"><div class="card-header">Revenue by Policy</div><div class="card-body"><canvas id="byPolicy" style="height:120px"></canvas></div></div>
            </div>
            <div class="col-12 col-xl-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header">Policies</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-sm align-middle">
                                <thead><tr><th>Policy</th><th class="text-end">Orders</th><th class="text-end">Revenue</th></tr></thead>
                                <tbody id="tbl"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
