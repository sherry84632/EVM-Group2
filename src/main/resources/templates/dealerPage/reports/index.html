<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer Reports</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>
<body class="bg-gradient2-custom">
<button class="mobile-menu-toggle" id="menuToggleBtn">
    <i class="fa-solid fa-bars"></i>
</button>
<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>
    <div class="mainContent flex-grow-1 p-3">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/showDealerHomePage"><i class="fa-solid fa-home me-1"></i>Home</a></li>
                <li class="breadcrumb-item active" aria-current="page"><i class="fa-solid fa-chart-line me-1"></i>Reports</li>
            </ol>
        </nav>
        <div class="d-flex wrap">
            <div class="d-flex" style="justify-content: center; align-items: center; padding: 35px;">
                <a href="/dealer/reports/sales" style="text-decoration: none;">
                    <button class="icon-btn">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>
                            Sales Report
                        </span>
                    </button>
                </a>
            </div>
            <div class="d-flex" style="justify-content: center; align-items: center; padding: 35px;">
                <a href="/dealer/reports/inventory" style="text-decoration: none;">
                    <button class="icon-btn">
                        <i class="fa-solid fa-warehouse"></i>
                        <span>
                            Inventory Report
                        </span>
                    </button>
                </a>
            </div>
            <div class="d-flex" style="justify-content: center; align-items: center; padding: 35px;">
                <a href="/dealer/reports/purchase" style="text-decoration: none;">
                    <button class="icon-btn">
                        <i class="fa-solid fa-file-invoice"></i>
                        <span>
                            Purchase Orders Report
                        </span>
                    </button>
                </a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/navBarMenuProject.js"></script>
</body>
</html>
