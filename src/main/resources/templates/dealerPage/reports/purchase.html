<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Dealer Purchase Orders Report</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>.stat-card{min-height:76px}</style>
    <script>
        function qs(id){return document.getElementById(id);} async function fetchJson(u){const r=await fetch(u,{credentials:'include'});return await r.json();}
        function formatCurrency(value){if(!value)return '$0';const num=typeof value==='string'?parseFloat(value):value;return '$'+Math.round(num).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});}
        function buildParams(){const from=qs('from').value;const to=qs('to').value;const p=new URLSearchParams();if(from)p.append('from',from);if(to)p.append('to',to);return p.toString();}
        let statusPie;
        async function loadData(){
            const p=buildParams();
            const k=await fetchJson(`/dealer/reports/purchase/kpis?${p}`);
            qs('kTotalPO').innerText=k.totalPO||0; qs('kTotalAmount').innerText=formatCurrency(k.totalAmount||0);
            const dist=await fetchJson(`/dealer/reports/purchase/status-distribution?${p}`);
            const labels=Object.keys(dist); const data=Object.values(dist);
            if(statusPie) statusPie.destroy(); statusPie=new Chart(qs('poStatus'),{type:'pie',data:{labels,datasets:[{data,backgroundColor:['#36a2eb','#4bc0c0','#9966ff','#ff9f40','#ff6384','#c9cbcf']} ]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}},tooltip:{enabled:true}}}});
        }
        window.addEventListener('DOMContentLoaded',()=>{qs('apply').addEventListener('click',loadData);loadData();});
    </script>
</head>
<body class="bg-gradient2-custom" style="overflow:hidden;">
<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>
    <div class="mainContent flex-grow-1 p-3">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/showDealerHomePage"><i class="fa-solid fa-home me-1"></i>Home</a></li>
                <li class="breadcrumb-item"><a href="/dealer/reports"><i class="fa-solid fa-chart-line me-1"></i>Reports</a></li>
                <li class="breadcrumb-item active" aria-current="page"><i class="fa-solid fa-file-invoice-dollar me-1"></i>Purchase Orders Report</li>
            </ol>
        </nav>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Purchase Orders Report</h3>
        </div>

        <form class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="row g-2 align-items-end">
                    <div class="col-6 col-md-3">
                        <label class="form-label">From</label>
                        <input type="date" id="from" class="form-control" />
                    </div>
                    <div class="col-6 col-md-3">
                        <label class="form-label">To</label>
                        <input type="date" id="to" class="form-control" />
                    </div>
                    <div class="col-12 col-md-3 d-grid">
                        <button type="button" id="apply" class="btn btn-primary">Apply</button>
                    </div>
                </div>
            </div>
        </form>

        <div class="row g-3 mb-3">
            <div class="col-12 col-sm-6 col-xl-3"><div class="card shadow-sm stat-card"><div class="card-body"><div class="text-muted small">Total PO</div><div class="fs-3 fw-semibold" id="kTotalPO">0</div></div></div></div>
            <div class="col-12 col-sm-6 col-xl-3"><div class="card shadow-sm stat-card"><div class="card-body"><div class="text-muted small">Total Amount</div><div class="fs-3 fw-semibold text-success" id="kTotalAmount">0</div></div></div></div>
        </div>

        <div class="card shadow-sm"><div class="card-header">Status Distribution</div><div class="card-body d-flex justify-content-center"><canvas id="poStatus" style="max-width:300px;max-height:200px"></canvas></div></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
