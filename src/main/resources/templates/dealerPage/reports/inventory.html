<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Dealer Inventory Report</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/mainPageStyle.css">
    <link rel="stylesheet" href="/css/iconStyle.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>.stat-card{min-height:96px}</style>
    <script>
        function qs(id){return document.getElementById(id);} async function fetchJson(u){const r=await fetch(u,{credentials:'include'});return await r.json();}
        function buildParams(){const from=qs('from').value;const to=qs('to').value;const p=new URLSearchParams();if(from)p.append('from',from);if(to)p.append('to',to);return p.toString();}
        let colorChart, versionChart;
        async function loadData(){
            const p=buildParams();
            const k=await fetchJson(`/dealer/reports/inventory/kpis?${p}`);
            qs('kTotal').innerText=k.total||0; qs('kAvail').innerText=k.available||0; qs('kSold').innerText=k.sold||0; qs('kTrans').innerText=k.transferred||0;
            const byColor=await fetchJson(`/dealer/reports/inventory/by-color`);
            const byVersion=await fetchJson(`/dealer/reports/inventory/by-version`);
            const colorLabels=byColor.map(r=>r.color||'N/A'); const colorData=byColor.map(r=>r.count);
            const versionLabels=byVersion.map(r=>r.version||'N/A'); const versionData=byVersion.map(r=>r.count);
            if(colorChart) colorChart.destroy(); colorChart=new Chart(qs('byColor'),{type:'bar',data:{labels:colorLabels,datasets:[{label:'Units',data:colorData,backgroundColor:'rgba(54,162,235,0.6)'}]},options:{scales:{y:{beginAtZero:true}}}});
            if(versionChart) versionChart.destroy(); versionChart=new Chart(qs('byVersion'),{type:'bar',data:{labels:versionLabels,datasets:[{label:'Units',data:versionData,backgroundColor:'rgba(153,102,255,0.6)'}]},options:{scales:{y:{beginAtZero:true}}}});
        }
        function onExport(){window.location.href='/dealer/reports/inventory/export.csv';}
        window.addEventListener('DOMContentLoaded',()=>{qs('apply').addEventListener('click',loadData);qs('export').addEventListener('click',onExport);loadData();});
    </script>
"""
</head>
<body class="bg-gradient2-custom">
<div class="d-flex">
    <div th:replace="~{mainPage/navBarFragment :: navBar}"></div>
    <div class="mainContent flex-grow-1 p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Inventory Report</h3>
            <button id="export" class="btn btn-outline-secondary btn-sm">Export CSV</button>
        </div>

        <form class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="row g-2 align-items-end">
                    <div class="col-6 col-md-3">
                        <label class="form-label">From</label>
                        <input type="date" id="from" class="form-control" />
                    </div>
                    <div class="col-6 col-md-3">
                        <label class="form-label">To</label>
                        <input type="date" id="to" class="form-control" />
                    </div>
                    <div class="col-12 col-md-3 d-grid">
                        <button type="button" id="apply" class="btn btn-primary">Apply</button>
                    </div>
                </div>
            </div>
        </form>

        <div class="row g-3 mb-3">
            <div class="col-12 col-sm-6 col-xl-3"><div class="card shadow-sm stat-card"><div class="card-body"><div class="text-muted small">Total</div><div class="fs-3 fw-semibold" id="kTotal">0</div></div></div></div>
            <div class="col-12 col-sm-6 col-xl-3"><div class="card shadow-sm stat-card"><div class="card-body"><div class="text-muted small">Available</div><div class="fs-3 fw-semibold text-primary" id="kAvail">0</div></div></div></div>
            <div class="col-12 col-sm-6 col-xl-3"><div class="card shadow-sm stat-card"><div class="card-body"><div class="text-muted small">Sold</div><div class="fs-3 fw-semibold" id="kSold">0</div></div></div></div>
            <div class="col-12 col-sm-6 col-xl-3"><div class="card shadow-sm stat-card"><div class="card-body"><div class="text-muted small">Transferred</div><div class="fs-3 fw-semibold" id="kTrans">0</div></div></div></div>
        </div>

        <div class="row g-3">
            <div class="col-12 col-xl-6"><div class="card shadow-sm h-100"><div class="card-header">By Color</div><div class="card-body"><canvas id="byColor" style="height:120px"></canvas></div></div></div>
            <div class="col-12 col-xl-6"><div class="card shadow-sm h-100"><div class="card-header">By Version</div><div class="card-body"><canvas id="byVersion" style="height:120px"></canvas></div></div></div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
